name: ORDER-002 one-shot type repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Apply typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"replacement anchor missing: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace("src/mimicus/config.py",
                  'resolved = profile or os.getenv("MIMICUS_PROFILE", "offline")',
                  'resolved = profile or os.environ.get("MIMICUS_PROFILE") or "offline"')

          replace("src/mimicus/benchmark.py", "from typing import Literal", "from typing import Any, Literal")
          replace("src/mimicus/benchmark.py", "def _metrics(rows: list[EpisodeResult]) -> dict[str, object]:", "def _metrics(rows: list[EpisodeResult]) -> dict[str, Any]:")
          replace("src/mimicus/benchmark.py", "def run_benchmark(count: int = 200, seed: int = 17082026) -> dict[str, object]:", "def run_benchmark(count: int = 200, seed: int = 17082026) -> dict[str, Any]:")
          replace("src/mimicus/benchmark.py", "def write_benchmark(output_json: Path, output_md: Path, count: int = 200) -> dict[str, object]:", "def write_benchmark(output_json: Path, output_md: Path, count: int = 200) -> dict[str, Any]:")

          replace("src/mimicus/events/ledger.py", "from datetime import UTC, datetime\nfrom typing import Any", "from collections.abc import Sequence\nfrom datetime import UTC, datetime\nfrom typing import Any")
          replace("src/mimicus/events/ledger.py", "    def append(self, event_type: str, payload: dict[str, Any] | None = None) -> LedgerEvent:\n        raw = {\n            \"sequence\": len(self.events),\n            \"event_id\": str(uuid4()),\n            \"run_id\": self.run_id,\n            \"event_type\": event_type,\n            \"timestamp\": datetime.now(UTC),\n            \"payload\": payload or {},\n            \"prev_event_hash\": self.head,\n        }\n        digest = sha256_text(raw[\"prev_event_hash\"] + canonical_json(raw))\n        event = LedgerEvent(**raw, event_hash=digest)",
                  "    def append(self, event_type: str, payload: dict[str, Any] | None = None) -> LedgerEvent:\n        sequence = len(self.events)\n        event_id = str(uuid4())\n        timestamp = datetime.now(UTC)\n        event_payload = payload or {}\n        prev_event_hash = self.head\n        raw: dict[str, Any] = {\n            \"sequence\": sequence,\n            \"event_id\": event_id,\n            \"run_id\": self.run_id,\n            \"event_type\": event_type,\n            \"timestamp\": timestamp,\n            \"payload\": event_payload,\n            \"prev_event_hash\": prev_event_hash,\n        }\n        digest = sha256_text(prev_event_hash + canonical_json(raw))\n        event = LedgerEvent(\n            sequence=sequence,\n            event_id=event_id,\n            run_id=self.run_id,\n            event_type=event_type,\n            timestamp=timestamp,\n            payload=event_payload,\n            prev_event_hash=prev_event_hash,\n            event_hash=digest,\n        )")
          replace("src/mimicus/events/ledger.py", "def verify(events: list[LedgerEvent | dict[str, Any]])", "def verify(events: Sequence[LedgerEvent | dict[str, Any]])")

          replace("src/mimicus/coalition/selector.py", "    rationale = {", "    rationale: dict[str, object] = {")

          replace("src/mimicus/falsifiers/primitives.py", "from typing import Any", "from typing import Any, cast")
          replace("src/mimicus/falsifiers/primitives.py", 'tolerance = float(spec.params.get("relative_tolerance", context.get("relative_tolerance", 0.05)))', 'tolerance = float(cast(Any, spec.params.get("relative_tolerance", context.get("relative_tolerance", 0.05))))')
          replace("src/mimicus/falsifiers/primitives.py", 'max_age = int(spec.params.get("max_age_days", context.get("max_age_days", 30)))', 'max_age = int(cast(Any, spec.params.get("max_age_days", context.get("max_age_days", 30))))')
          replace("src/mimicus/falsifiers/primitives.py", 'required = int(spec.params.get("min_independent", 2))', 'required = int(cast(Any, spec.params.get("min_independent", 2)))')

          replace("src/mimicus/falsifiers/builtins.py", "from datetime import UTC, datetime", "from datetime import UTC, datetime\nfrom typing import Any")
          replace("src/mimicus/falsifiers/builtins.py", "    common = {", "    common: dict[str, Any] = {")

          replay = Path("src/mimicus/orchestration/replay.py")
          replay.write_text('''from __future__ import annotations\n\nfrom collections.abc import Sequence\nfrom typing import Any\n\nfrom mimicus.events.ledger import EventLedger, LedgerEvent\n\n\ndef verify_replay(events: Sequence[LedgerEvent | dict[str, Any]], expected_head: str | None = None) -> dict[str, object]:\n    ok, head = EventLedger.verify(events)\n    if expected_head is not None and head != expected_head:\n        return {\"verified\": False, \"head\": head, \"reason\": \"snapshot/head mismatch\"}\n    return {\"verified\": ok, \"head\": head, \"reason\": None if ok else head}\n''')

          replace("src/mimicus/falsifiers/k3_compat.py", "from __future__ import annotations\n", "from __future__ import annotations\n\nfrom typing import Any\n")
          replace("src/mimicus/falsifiers/k3_compat.py", "    vectors = [", "    vectors: list[tuple[str, str, dict[str, Any], str]] = [")

          replace("src/mimicus/providers/base.py", "from dataclasses import dataclass", "from dataclasses import dataclass\nfrom typing import Any")
          replace("src/mimicus/providers/base.py", "    fixture: dict[str, object]", "    fixture: dict[str, Any]")

          replace("src/mimicus/storage/repository.py", "from sqlalchemy import create_engine, select", "from sqlalchemy import create_engine, insert, select")
          replace("src/mimicus/storage/repository.py", "RunRow.__table__.insert().values(", "insert(RunRow).values(")
          replace("src/mimicus/storage/repository.py", "EventRow.__table__.insert().values(", "insert(EventRow).values(")

          replace("src/mimicus/orchestration/engine.py", "            result = audition(candidate.fingerprint, domain, category, passed_answer)\n            calibration = self.calibration.get(candidate.fingerprint, domain)\n            calibration.update(predicted_probability=0.8, outcome=result.passed, canary=True)\n            ledger.append(\"agent_auditioned\", {\"fingerprint\": candidate.fingerprint, \"domain\": domain, \"category\": category, \"passed\": result.passed, \"score\": result.score})\n            audited.append(AgentCandidate(**{**candidate.__dict__, \"audition_score\": result.score, \"calibration_score\": calibration.trust}))",
                  "            audition_result = audition(candidate.fingerprint, domain, category, passed_answer)\n            calibration = self.calibration.get(candidate.fingerprint, domain)\n            calibration.update(predicted_probability=0.8, outcome=audition_result.passed, canary=True)\n            ledger.append(\"agent_auditioned\", {\"fingerprint\": candidate.fingerprint, \"domain\": domain, \"category\": category, \"passed\": audition_result.passed, \"score\": audition_result.score})\n            audited.append(AgentCandidate(**{**candidate.__dict__, \"audition_score\": audition_result.score, \"calibration_score\": calibration.trust}))")

          replace("src/mimicus/interfaces/mcp_server.py", "from typing import Any", "from typing import Any, Literal")
          replace("src/mimicus/interfaces/mcp_server.py", '        depth: str = "normal",', '        depth: Literal["fast", "normal", "deep"] = "normal",')

          replace("src/mimicus/interfaces/cli.py", "        result = _engine(args.profile).run(RunRequest.model_validate(payload))\n        print(result.model_dump_json(indent=2))", "        run_result = _engine(args.profile).run(RunRequest.model_validate(payload))\n        print(run_result.model_dump_json(indent=2))")
          replace("src/mimicus/interfaces/cli.py", "        result = Repository(_database_url()).get_run(args.run_id)\n        if result is None:", "        replay_row = Repository(_database_url()).get_run(args.run_id)\n        if replay_row is None:")
          replace("src/mimicus/interfaces/cli.py", "        full = MiMicusEngine(_database_url()).get_run(args.run_id)\n        print(json.dumps(full[\"replay_state\"], indent=2, sort_keys=True))", "        full = MiMicusEngine(_database_url()).get_run(args.run_id)\n        if full is None:\n            print(json.dumps({\"verified\": False, \"reason\": \"run disappeared\", \"run_id\": args.run_id}))\n            return 2\n        print(json.dumps(full[\"replay_state\"], indent=2, sort_keys=True))")
          PY
      - name: Format and validate typing
        run: |
          ruff format .
          ruff check .
          mypy src/mimicus
          pytest -q tests/unit tests/integration
      - name: Commit strict typing repair
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'ORDER-002: repair strict typing without suppressions'
          git push origin HEAD:order-002-mimicus-v01
