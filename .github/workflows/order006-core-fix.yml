name: ORDER-006 core binding and metrics patch
on:
  push:
    branches: [order-002-mimicus-v01]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ruff==0.16.3
      - name: Apply ORDER-006 semantic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          market = Path("src/mimicus/falsifiers/market.py")
          text = market.read_text()
          old = '''    def _applicability(spec: FalsifierSpec, claim: Claim, evidence: dict[str, Any]) -> float:\n        keys = set(evidence)\n'''
          new = '''    def _applicability(spec: FalsifierSpec, claim: Claim, evidence: dict[str, Any]) -> float:\n        keys = set(evidence)\n        # A claim-aware missing-evidence probe is still useful: the deterministic\n        # primitive will return INCONCLUSIVE and proves that task wording did not\n        # synthesize facts. This is not positive evidence or a structural precheck.\n        if not evidence and claim.claim_type == "other":\n            return 0.10\n'''
          assert old in text
          market.write_text(text.replace(old, new))

          core = Path("src/mimicus/orchestration/swarm_core.py")
          text = core.read_text()
          old = '''    for claim in claims_by_fp.values():\n        if claim.hash in decision.selected_claim_hashes:\n            target_status = {\n                "SUPPORTED": ClaimStatus.SUPPORTED,\n                "FALSIFIED": ClaimStatus.FALSIFIED,\n                "INCONCLUSIVE": ClaimStatus.INCONCLUSIVE,\n            }[decision.epistemic_status]\n            claim.status = target_status\n    final_claims: list[dict[str, Any]] = []\n    for fp, claim in sorted(claims_by_fp.items()):\n        member = selected_by_fp[fp]\n        relevant = [cap for cap in profile.required_capabilities if cap in member.capabilities]\n        final_claims.append(\n            claim.model_dump(mode="json")\n            | {\n                "claim_hash": claim.hash,\n'''
          new = '''    selected_status = {\n        "SUPPORTED": ClaimStatus.SUPPORTED,\n        "FALSIFIED": ClaimStatus.FALSIFIED,\n        "INCONCLUSIVE": ClaimStatus.INCONCLUSIVE,\n    }[decision.epistemic_status]\n    final_claims: list[dict[str, Any]] = []\n    for fp, claim in sorted(claims_by_fp.items()):\n        member = selected_by_fp[fp]\n        relevant = [cap for cap in profile.required_capabilities if cap in member.capabilities]\n        immutable_claim_hash = claim.hash\n        persisted_status = selected_status if immutable_claim_hash in decision.selected_claim_hashes else claim.status\n        final_claims.append(\n            claim.model_dump(mode="json")\n            | {\n                "status": persisted_status.value,\n                "claim_hash": immutable_claim_hash,\n'''
          assert old in text
          text = text.replace(old, new)
          text = text.replace("from mimicus.types import BankruptcyState, ClaimStatus, Verdict", "from mimicus.types import BankruptcyState, ClaimStatus")
          core.write_text(text)

          cli = Path("src/mimicus/interfaces/cli.py")
          text = cli.read_text()
          old = '''from mimicus.storage.repository import Repository\n'''
          new = '''from mimicus.storage.repository import Repository\nfrom mimicus.verification.models import VerificationSubmission\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''    p_replay = sub.add_parser("replay")\n    p_replay.add_argument("run_id")\n\n    p_bench = sub.add_parser("benchmark")\n'''
          new = '''    p_replay = sub.add_parser("replay")\n    p_replay.add_argument("run_id")\n\n    p_verify = sub.add_parser("verify")\n    p_verify.add_argument("--profile", choices=sorted(PROFILES), default="offline")\n    p_verify.add_argument("--receipt-file", required=True)\n\n    p_bench = sub.add_parser("benchmark")\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''    if args.command == "benchmark":\n'''
          new = '''    if args.command == "verify":\n        payload = json.loads(Path(args.receipt_file).read_text(encoding="utf-8"))\n        submission = VerificationSubmission.model_validate(payload)\n        verified = _engine(args.profile).submit_verification(submission)\n        print(json.dumps(verified, indent=2, sort_keys=True, default=str))\n        return 0 if verified.get("accepted") else 2\n    if args.command == "benchmark":\n'''
          assert old in text
          cli.write_text(text.replace(old, new))

          bench = Path("src/mimicus/benchmark.py")
          text = bench.read_text()
          text = text.replace(
              "    germinal_transitions: int\n    work_steps: int\n",
              "    germinal_transitions: int\n    subtask_count: int\n    work_steps: int\n",
              1,
          )
          text = text.replace(
              "    germinal_transitions: int\n    work_steps: int\n",
              "    germinal_transitions: int\n    subtask_count: int\n    work_steps: int\n",
              1,
          )
          text = text.replace("            germinal_transitions=0,\n            work_steps=", "            germinal_transitions=0,\n            subtask_count=0,\n            work_steps=")
          text = text.replace(
              "            germinal_transitions=len(result.germinal_changes),\n            work_steps=",
              "            germinal_transitions=len(result.germinal_changes),\n            subtask_count=len(result.subtasks),\n            work_steps=",
          )
          old = '''                        germinal_transitions=output.germinal_transitions,\n                        work_steps=output.work_steps,\n'''
          new = '''                        germinal_transitions=output.germinal_transitions,\n                        subtask_count=output.subtask_count,\n                        work_steps=output.work_steps,\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''        "avg_falsifier_executions": mean(row.falsifier_executions for row in rows) if rows else 0.0,\n        "avg_simulated_cost": mean(row.cost for row in rows) if rows else 0.0,\n'''
          new = '''        "avg_falsifier_executions": mean(row.falsifier_executions for row in rows) if rows else 0.0,\n        "avg_subtasks": mean(row.subtask_count for row in rows) if rows else 0.0,\n        "avg_simulated_cost": mean(row.cost for row in rows) if rows else 0.0,\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''    challenge_edge_distribution: dict[str, int] = {}\n    for row in e_rows:\n        morphology_distribution[row.morphology] = morphology_distribution.get(row.morphology, 0) + 1\n        agent_count_distribution[str(row.agent_count)] = agent_count_distribution.get(str(row.agent_count), 0) + 1\n        challenge_edge_distribution[str(row.communication_edge_count)] = challenge_edge_distribution.get(str(row.communication_edge_count), 0) + 1\n'''
          new = '''    challenge_edge_distribution: dict[str, int] = {}\n    subtask_count_distribution: dict[str, int] = {}\n    for row in e_rows:\n        morphology_distribution[row.morphology] = morphology_distribution.get(row.morphology, 0) + 1\n        agent_count_distribution[str(row.agent_count)] = agent_count_distribution.get(str(row.agent_count), 0) + 1\n        challenge_edge_distribution[str(row.communication_edge_count)] = challenge_edge_distribution.get(str(row.communication_edge_count), 0) + 1\n        subtask_count_distribution[str(row.subtask_count)] = subtask_count_distribution.get(str(row.subtask_count), 0) + 1\n'''
          assert old in text
          text = text.replace(old, new)
          text = text.replace('"benchmark_version": "ORDER-004-v0.2.1-neutral-execution-derived"', '"benchmark_version": "ORDER-006-v0.3.0-swarm-core"')
          old = '''        "morphology_distribution": {"classes": morphology_distribution, "agent_counts": agent_count_distribution, "challenge_edges": challenge_edge_distribution},\n'''
          new = '''        "morphology_distribution": {\n            "classes": morphology_distribution,\n            "agent_counts": agent_count_distribution,\n            "challenge_edges": challenge_edge_distribution,\n            "subtask_counts": subtask_count_distribution,\n        },\n'''
          assert old in text
          bench.write_text(text.replace(old, new))
          PY
      - run: ruff check . --fix
      - run: ruff format .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/0003_order006_swarm_core.py src/mimicus
          if ! git diff --cached --quiet; then
            git commit -m "ORDER-006: bind immutable claims, CLI verification, benchmark swarm metrics"
            git push origin HEAD:order-002-mimicus-v01
          fi
