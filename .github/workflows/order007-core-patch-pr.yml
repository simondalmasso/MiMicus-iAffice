name: ORDER-007 core patch PR lane
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'order-002-mimicus-v01' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Execute canonical surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/order007-core-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'order007-core-patch', 'exec'))
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff format src/mimicus/orchestration/swarm_core.py && ruff check src/mimicus/orchestration/swarm_core.py
      - name: Commit patched core
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus/orchestration/swarm_core.py
          git diff --cached --check
          git commit -m 'ORDER-007: close claim market and hierarchy invariants'
          git push origin HEAD:order-002-mimicus-v01
