name: ORDER-002 bootstrap normalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Fix then format then verify
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-002: finish Ruff normalization'
          git push origin HEAD:order-002-mimicus-v01
