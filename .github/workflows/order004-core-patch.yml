name: ORDER-004 core remediation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ORDER-004 core patch
        run: python scripts/order004_core_patch.py
      - name: Remove one-shot patcher
        run: |
          git rm scripts/order004_core_patch.py .github/workflows/order004-core-patch.yml
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-004: integrate epistemic correctness core'
          git push origin HEAD:order-002-mimicus-v01
