name: ORDER-003 recovery identity continuity fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Preserve exact identity metadata across recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/mimicus/validation/order003_worker.py")
          text = path.read_text(encoding="utf-8")
          old = '"provenance": "ORDER-003 process recovery probe"'
          new = '"provenance": "ORDER-003 process whitewash probe"'
          if old not in text:
              raise SystemExit("recovery provenance anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/order003-recovery-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus/validation/order003_worker.py
          git commit -m 'ORDER-003: preserve lineage identity metadata during recovery'
          git push origin HEAD:order-002-mimicus-v01
