name: ORDER-008 one-shot semantic compatibility fix

on:
  push:
    branches: [order-002-mimicus-v01]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Apply exact semantic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected snippet missing: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/mimicus/orchestration/production_core.py',
              '        authority = float(row.get("contributor_authority", 0.5))\n',
              '        raw_authority = row.get("contributor_authority")\n        authority = float(raw_authority) if isinstance(raw_authority, (int, float)) else 0.5\n',
          )
          replace(
              'src/mimicus/orchestration/production_core.py',
              '    claims = {Claim.model_validate(row).identity_hash: Claim.model_validate(row) for row in claim_rows}\n',
              '    parsed_claims = [_claim_from_row(row) for row in claim_rows]\n    claims = {claim.identity_hash: claim for claim in parsed_claims}\n',
          )
          replace(
              'src/mimicus/orchestration/semantic_replay.py',
              '                float(row.get("contributor_authority", 0.5)),\n',
              '                float(row["contributor_authority"]) if isinstance(row.get("contributor_authority"), (int, float)) else 0.5,\n',
          )
          replace(
              'scripts/order007_evidence.py',
              'from mimicus.claims.models import Claim\n',
              'from mimicus.claims.models import Claim, NumericAssertion\n',
          )
          replace(
              'scripts/order007_evidence.py',
              '        claim = Claim(\n            statement=statement,\n            domain=request.domain,\n            probability=probabilities.get(request.phenotype, 0.6),\n            claim_type="numeric",\n            evidence_refs=evidence_refs,\n        )\n',
              '        asserted_value = next(\n            (\n                row.get("extracted_facts", {}).get("claimed")\n                for row in request.evidence\n                if isinstance(row, dict)\n                and isinstance(row.get("extracted_facts"), dict)\n                and row.get("extracted_facts", {}).get("claimed") is not None\n            ),\n            None,\n        )\n        claim = Claim(\n            statement=statement,\n            domain=request.domain,\n            probability=probabilities.get(request.phenotype, 0.6),\n            claim_type="numeric",\n            assertion=(\n                NumericAssertion(asserted_value=float(asserted_value))\n                if isinstance(asserted_value, (int, float))\n                else None\n            ),\n            evidence_refs=evidence_refs,\n        )\n',
          )
          replace(
              'scripts/order007_evidence.py',
              '            depth="deep",\n        )\n    )\n    assert run.final_claims and run.falsifiers\n',
              '            depth="deep",\n            learn=True,\n        )\n    )\n    assert run.final_claims and run.falsifiers\n',
          )
          PY
      - name: Remove one-shot workflow and push patch
        shell: bash
        run: |
          rm .github/workflows/order008-one-shot-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-008: restore semantic regressions under explicit learning'
          git push origin HEAD:order-002-mimicus-v01
