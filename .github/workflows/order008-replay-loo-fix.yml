name: ORDER-008 replay LOO one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact persisted replay inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected snippet missing: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/mimicus/falsifiers/primitives.py',
              '''    bound_evidence: dict[str, object] = {\n        "primitive_evidence": raw.evidence,\n        "target_claim_identity_hash": claim.identity_hash,\n''',
              '''    bound_evidence: dict[str, object] = {\n        "primitive_evidence": raw.evidence,\n        "tested_evidence_context": dict(context),\n        "target_claim_identity_hash": claim.identity_hash,\n''',
          )

          replace(
              'src/mimicus/orchestration/production_core.py',
              '''        projections = [boundary.projections[value] for value in execution.evidence_projection_hashes if value in boundary.projections]\n        replay_executions.append(\n            {\n                "spec": specs[execution.spec_hash].model_dump(mode="json"),\n                "claim": claim.model_dump(mode="json"),\n                "evidence_context": _merge_projection_context(projections),\n                "evidence_projection_hashes": list(execution.evidence_projection_hashes),\n''',
              '''        tested_context = execution.evidence.get("tested_evidence_context")\n        if not isinstance(tested_context, dict):\n            raise RuntimeError("claim-bound execution is missing exact persisted evidence context")\n        replay_executions.append(\n            {\n                "spec": specs[execution.spec_hash].model_dump(mode="json"),\n                "claim": claim.model_dump(mode="json"),\n                "evidence_context": dict(tested_context),\n                "evidence_context_hash": sha256_obj(tested_context),\n                "evidence_projection_hashes": list(execution.evidence_projection_hashes),\n''',
          )

          replace(
              'src/mimicus/orchestration/semantic_replay.py',
              '''            execution = execute_claim_bound(\n                spec,\n                claim,\n                dict(row.get("evidence_context", {})),\n                evidence_projection_hashes=tuple(row.get("evidence_projection_hashes", [])),\n                selection_reason=row.get("selection_reason"),\n            )\n            replayed_executions.append(execution)\n            execution_ok = execution_ok and execution.execution_snapshot_hash == row.get("expected_snapshot_hash") and execution.verdict.value == row.get("expected_verdict")\n''',
              '''            exact_context = dict(row.get("evidence_context", {}))\n            context_hash_ok = sha256_obj(exact_context) == row.get("evidence_context_hash")\n            execution = execute_claim_bound(\n                spec,\n                claim,\n                exact_context,\n                evidence_projection_hashes=tuple(row.get("evidence_projection_hashes", [])),\n                selection_reason=row.get("selection_reason"),\n            )\n            replayed_executions.append(execution)\n            execution_ok = (\n                execution_ok\n                and context_hash_ok\n                and execution.execution_snapshot_hash == row.get("expected_snapshot_hash")\n                and execution.verdict.value == row.get("expected_verdict")\n            )\n''',
          )
          PY
          python -m pip install -r requirements.lock >/dev/null
          python -m pip install --no-deps -e . >/dev/null
          ruff format .
          ruff check . --fix --unsafe-fixes
          ruff check .
          mypy src/mimicus
      - name: Probe historical verification and exact semantic replay
        shell: bash
        run: |
          python scripts/order007_evidence.py "$RUNNER_TEMP/ORDER-007"
          python - <<'PY'
          from mimicus.canonical import sha256_obj
          from mimicus.claims.evidence_bundle import EvidenceInput
          from mimicus.claims.models import Claim, NumericAssertion
          from mimicus.orchestration.engine import MiMicusEngine, RunRequest
          from mimicus.providers.base import ProviderRequest, ProviderResponse
          from mimicus.providers.scripted import ScriptedProvider

          class DivergentProvider(ScriptedProvider):
              async def generate_request_async(self, request: ProviderRequest) -> ProviderResponse:
                  self.generate_calls += 1
                  asserted = 1200.0 if request.phenotype == "numeric-1" else 1300.0
                  refs = [str(row["evidence_hash"]) for row in request.evidence if isinstance(row, dict) and isinstance(row.get("evidence_hash"), str)]
                  return ProviderResponse(
                      claim=Claim(statement=f"Annual total is {asserted:.0f}", domain=request.domain, probability=0.8, claim_type="numeric", assertion=NumericAssertion(asserted_value=asserted), evidence_refs=refs),
                      cost=0.0,
                      latency_ms=0.0,
                      trace_id=f"diag-{self.generate_calls}-{request.phenotype}",
                      usage={"simulated": True, "calls": 1, "monetary_cost_status": "KNOWN", "monetary_cost_usd": 0.0},
                  )

          db = "/tmp/order008-replay-fix.db"
          engine = MiMicusEngine(f"sqlite:///{db}", provider=DivergentProvider())
          ev = EvidenceInput(origin="probe", independence_cluster="a", content="numeric", extracted_facts={"price": 100, "users": 12, "claimed": 1200, "price_period": "annual", "clusters": ["a", "b"], "texts": ["alpha independent", "beta independent"]})
          run = engine.run(RunRequest(task="Audit annual total using independent evidence.", domain="finance", source_mode="runtime", evidence=[ev], depth="deep", max_agents=4, max_concurrency=4))
          numeric = [row for row in run.falsifiers if row.get("primitive") == "numeric_invariant"]
          assert {row.get("verdict") for row in numeric} >= {"PASS", "FAIL"}
          for row in numeric:
              context = row["evidence"].get("tested_evidence_context")
              assert isinstance(context, dict)
              assert sha256_obj(context) == row["evidence"]["evidence_context_hash"]
          restarted = MiMicusEngine(f"sqlite:///{db}", provider=DivergentProvider())
          replay = restarted.get_run(run.run_id)["replay_state"]
          assert replay["integrity_verified"] is True
          assert replay["semantic_reexecution_verified"] is True, replay
          PY
      - name: Commit patch and remove worker
        shell: bash
        run: |
          rm .github/workflows/order008-replay-loo-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-008: persist exact falsifier context for semantic replay'
          git push origin HEAD:order-002-mimicus-v01
