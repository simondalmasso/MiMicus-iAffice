name: ORDER-008 F039 one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch hierarchical claim-scoped market coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/mimicus/orchestration/swarm_core.py')
          text = p.read_text(encoding='utf-8')
          old = '''            market_selected, market_all = FalsifierMarket().select_for_claims(
                candidate_specs,
                [claims_by_node[key] for key in sorted(claims_by_node)],
                evidence=evidence_context,
                budget_usd=market_budget,
                max_tests={"fast": 1, "normal": 3, "deep": 5}[request.depth],
                evidence_quality=1.0 if evidence_bundle.items else 0.0,
            )
'''
          new = '''            market = FalsifierMarket()
            ordered_claims = [claims_by_node[key] for key in sorted(claims_by_node)]
            if plan.name == MorphologyName.HIERARCHICAL_FANOUT_FANIN:
                market_selected = []
                market_all = []
                remaining_market_budget = market_budget
                for claim in ordered_claims:
                    retained, candidates = market.select_for_claims(
                        candidate_specs,
                        [claim],
                        evidence=claim_context_by_identity.get(claim.identity_hash, {}),
                        budget_usd=remaining_market_budget,
                        max_tests=1,
                        evidence_quality=1.0 if claim.evidence_refs else 0.0,
                    )
                    market_all.extend(candidates)
                    if not retained:
                        continue
                    bid = retained[0]
                    market_selected.append(
                        replace(
                            bid,
                            selection_reason=f"{bid.selection_reason}; hierarchical_claim_scope_coverage",
                        )
                    )
                    remaining_market_budget = max(
                        0.0,
                        remaining_market_budget - spec_by_hash[bid.spec_hash].estimated_cost,
                    )
            else:
                market_selected, market_all = market.select_for_claims(
                    candidate_specs,
                    ordered_claims,
                    evidence=evidence_context,
                    budget_usd=market_budget,
                    max_tests={"fast": 1, "normal": 3, "deep": 5}[request.depth],
                    evidence_quality=1.0 if evidence_bundle.items else 0.0,
                )
'''
          if old not in text:
              raise SystemExit('ensure_market snippet not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install -r requirements.lock >/dev/null
          python -m pip install --no-deps -e . >/dev/null
          ruff format .
          ruff check . --fix --unsafe-fixes
          ruff check .
          mypy src/mimicus
      - name: F039 kill gate plus historical regressions
        shell: bash
        run: |
          python scripts/order007_evidence.py "$RUNNER_TEMP/ORDER-007"
          python - <<'PY'
          from mimicus.canonical import sha256_obj
          from mimicus.claims.evidence_bundle import EvidenceInput
          from mimicus.claims.models import Claim
          from mimicus.falsifiers.spec import FalsifierExecution
          from mimicus.orchestration.engine import MiMicusEngine, RunRequest
          from mimicus.orchestration.production_synthesis import synthesize_production
          from mimicus.types import Verdict

          registry = {}
          facts = {
              "price": 100, "users": 12, "claimed": 1200, "price_period": "annual",
              "evidence_date": "2026-08-19T00:00:00+00:00", "as_of": "2026-08-20T00:00:00+00:00",
              "clusters": ["h-a", "h-b"], "texts": ["first independently written source", "second independently written source"],
              "claim_figure": "1200", "evidence_spans": [{"span_id": "s1", "supported_figures": ["1200"], "material_support": True}],
              "absence_key": "missing-prerequisite", "registry": registry, "registry_snapshot_hash": sha256_obj(registry),
          }
          ev = EvidenceInput(origin="order008-hierarchy-probe", independence_cluster="h-a", content="all structured facts", extracted_facts=facts)
          run = MiMicusEngine("sqlite:////tmp/order008-f039.db").run(RunRequest(task="Resolve all required audit predicates.", domain="research", evidence=[ev], depth="deep", max_agents=4, max_concurrency=4))
          required = set(run.hierarchy_execution["required_subtasks"])
          selected = set(run.swarm_decision["selected_claim_hashes"])
          assert run.morphology == "hierarchical_fanout_fanin"
          assert run.hierarchy_execution["complete"] is True
          assert run.swarm_decision["epistemic_status"] == "SUPPORTED", run.swarm_decision
          assert len(selected) == len(required)
          assert required <= set(run.swarm_decision["provenance_hashes"])
          assert selected <= set(run.swarm_decision["provenance_hashes"])
          selected_statements = [row["statement"] for row in run.final_claims if row["claim_hash"] in selected]
          assert all(value in run.swarm_decision["candidate_answer"] for value in selected_statements)
          market_selected = run.evidence_provenance["claim_aware_market"]["selected"]
          assert {row["target_claim_hash"] for row in market_selected} >= selected
          assert all("hierarchical_claim_scope_coverage" in row["selection_reason"] for row in market_selected)

          incomplete = MiMicusEngine("sqlite:////tmp/order008-f039-incomplete.db").run(RunRequest(task="Resolve all required audit predicates.", domain="research", evidence=[ev], depth="deep", max_agents=3, max_concurrency=3))
          assert incomplete.hierarchy_execution["unresolved_subtasks"]
          assert incomplete.swarm_decision["epistemic_status"] == "INCONCLUSIVE"

          subtask = "s" * 64
          a = Claim(statement="A", domain="research", probability=0.9)
          b = Claim(statement="B", domain="research", probability=0.8)
          executions = [
              FalsifierExecution(spec_hash="1"*64, verdict=Verdict.PASS, execution_snapshot_hash="2"*64, target_claim_hashes=(a.identity_hash,)),
              FalsifierExecution(spec_hash="3"*64, verdict=Verdict.PASS, execution_snapshot_hash="4"*64, target_claim_hashes=(b.identity_hash,)),
          ]
          conflict = synthesize_production(
              [("fa", a, 0.9, subtask), ("fb", b, 0.8, subtask)], executions, [], budget={}, coverage_complete=True,
              morphology="hierarchical_fanout_fanin", subtasks=[{"subtask_hash": subtask, "dependency_group": "g"}],
              hierarchy_execution={"required_subtasks": [subtask], "unresolved_subtasks": []},
          )
          assert conflict.epistemic_status == "INCONCLUSIVE"
          assert any(row.get("kind") == "same_subtask_conflict" for row in conflict.unresolved_disagreements)
          PY
      - name: Commit repair and remove worker
        shell: bash
        run: |
          rm .github/workflows/order008-f039-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-008: verify every hierarchical predicate before fan-in'
          git push origin HEAD:order-002-mimicus-v01
