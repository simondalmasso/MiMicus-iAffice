name: ORDER-006 minimal semantic patcher
on:
  push:
    branches: [order-002-mimicus-v01]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ruff==0.16.3
      - run: |
          python - <<'PY'
          from pathlib import Path

          market = Path('src/mimicus/falsifiers/market.py')
          text = market.read_text()
          needle = '        keys = set(evidence)\n'
          assert needle in text and 'claim-aware missing-evidence probe' not in text
          text = text.replace(needle, needle + '        # A claim-aware missing-evidence probe returns only INCONCLUSIVE when facts are absent.\n        if not evidence and claim.claim_type == "other":\n            return 0.10\n', 1)
          market.write_text(text)

          core = Path('src/mimicus/orchestration/swarm_core.py')
          text = core.read_text()
          start = text.index('    for claim in claims_by_fp.values():\n')
          end = text.index('    falsifier_rows = []\n', start)
          replacement = '''    selected_status = {\n        "SUPPORTED": ClaimStatus.SUPPORTED,\n        "FALSIFIED": ClaimStatus.FALSIFIED,\n        "INCONCLUSIVE": ClaimStatus.INCONCLUSIVE,\n    }[decision.epistemic_status]\n    final_claims: list[dict[str, Any]] = []\n    for fp, claim in sorted(claims_by_fp.items()):\n        member = selected_by_fp[fp]\n        relevant = [cap for cap in profile.required_capabilities if cap in member.capabilities]\n        immutable_claim_hash = claim.hash\n        persisted_status = selected_status if immutable_claim_hash in decision.selected_claim_hashes else claim.status\n        final_claims.append(\n            claim.model_dump(mode="json")\n            | {\n                "status": persisted_status.value,\n                "claim_hash": immutable_claim_hash,\n                "provider_trace_id": claim_trace_ids.get(fp),\n                "contributor_fingerprint": fp,\n                "contributor_capabilities": relevant,\n                "contributor_test_families": [f"{cap}_verified_task" for cap in relevant],\n            }\n        )\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('from mimicus.types import BankruptcyState, ClaimStatus, Verdict', 'from mimicus.types import BankruptcyState, ClaimStatus')
          text = text.replace('        if profile.required_capabilities == ("synthesize",) or len(required) >= 2:\n            if overlap_candidates:\n', '        if (profile.required_capabilities == ("synthesize",) or len(required) >= 2) and overlap_candidates:\n')
          core.write_text(text)
          PY
      - run: ruff check . --fix
      - run: ruff format .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/0003_order006_swarm_core.py src/mimicus
          git commit -m "ORDER-006: fix immutable claim binding and missing-evidence probes"
          git push origin HEAD:order-002-mimicus-v01
