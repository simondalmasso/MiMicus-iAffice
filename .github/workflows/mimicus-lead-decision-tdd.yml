name: Mimicus Lead Decision Verification

on:
  push:
    branches:
      - "aud-arq/mimicus-lead-decision-v1"
      - "aud-arq/mimicus-live-observer-v1"

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/MiMicus-swarm-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests and coverage
        run: pytest --cov=mimicus --cov-report=term-missing
      - name: Ruff
        run: ruff check src tests
      - name: Cockpit JS syntax
        run: node --check ../../public/app.js
      - name: Mypy
        run: mypy src/mimicus
      - name: Build
        run: python -m build
