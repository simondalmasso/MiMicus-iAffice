name: Mimicus Lead Decision TDD

on:
  push:
    branches:
      - "aud-arq/mimicus-lead-decision-v1"

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/MiMicus-swarm-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/mimicus
