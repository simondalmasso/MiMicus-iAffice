name: ORDER-008 exact-head CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Canonical formatter must be a no-op
        run: ruff format . && git diff --exit-code
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mimicus
      - run: pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90

  order008-focused-kills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Historical F029 confirmation
        run: pytest tests/unit/test_order006_core.py tests/integration/test_order006_runtime.py
      - name: F039 kill
        run: pytest tests/unit/test_order008_f039.py
      - name: F040 kill
        run: pytest tests/unit/test_order008_f040.py
      - name: F041 kill
        run: pytest tests/unit/test_order008_f041.py
      - name: F038 F042 F043 F044 runtime kills
        run: pytest tests/integration/test_order008_runtime.py -vv

  order008-runtime-evidence-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Generate executable ORDER-008 evidence
        env: {OPENAI_API_KEY: ""}
        run: python scripts/order008_evidence.py "$RUNNER_TEMP/ORDER-008"
      - name: Execute ORDER-008 MCP restart and revocation E2E
        env: {OPENAI_API_KEY: ""}
        run: python scripts/order008_mcp_e2e.py "$RUNNER_TEMP/ORDER-008"
      - name: Validate generated ORDER-008 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ORDER-008"
          json_files = [
              "CLAIM_BOUND_FALSIFIERS.json",
              "HIERARCHICAL_COMPOSITE_SYNTHESIS.json",
              "RECEIPT_CASCADE_REVOCATION.json",
              "EVIDENCE_PROJECTION_INTEGRITY.json",
              "VERIFIED_REMOVAL_SCOPE.json",
              "CORE_MEMORY_LEARN_PROGRESS.json",
              "SEMANTIC_REPLAY.json",
              "MCP_E2E.json",
          ]
          for name in json_files:
              payload = json.loads((root / name).read_text())
              assert payload["pass"] is True, name
          for name in ["RUNTIME_REGRESSION_F001_F037.txt", "TEST_RESULTS.txt"]:
              assert (root / name).is_file() and (root / name).stat().st_size > 0, name
          mcp = json.loads((root / "MCP_E2E.json").read_text())
          assert mcp["legacy_escape_fields_exposed"] == []
          assert mcp["restart_before_revocation"]["verified_memory_reused"] is True
          assert mcp["restart_after_revocation"]["revoked_memory_excluded"] is True
          assert mcp["restart_after_revocation"]["semantic_replay_verified"] is True
          print("ORDER008_RUNTIME_EVIDENCE_MCP=PASS")
          PY
      - name: Emit generated evidence for exact commit materialization
        shell: bash
        run: |
          root="$RUNNER_TEMP/ORDER-008"
          for name in \
            CLAIM_BOUND_FALSIFIERS.json \
            HIERARCHICAL_COMPOSITE_SYNTHESIS.json \
            RECEIPT_CASCADE_REVOCATION.json \
            EVIDENCE_PROJECTION_INTEGRITY.json \
            VERIFIED_REMOVAL_SCOPE.json \
            CORE_MEMORY_LEARN_PROGRESS.json \
            SEMANTIC_REPLAY.json \
            RUNTIME_REGRESSION_F001_F037.txt \
            MCP_E2E.json \
            TEST_RESULTS.txt; do
            echo "===ORDER008_FILE:${name}==="
            cat "$root/$name"
            echo "===ORDER008_END:${name}==="
          done

  security-historical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/check_security.py
      - run: python scripts/check_ledger.py
      - run: python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
      - run: python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"
      - run: pytest tests/unit/test_order005_correctness.py tests/integration/test_order005_runtime.py
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order005_evidence.py "$RUNNER_TEMP/ORDER-005"
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order005_mcp_e2e.py "$RUNNER_TEMP/ORDER-005-MCP"
      - run: pytest tests/unit/test_order006_core.py tests/integration/test_order006_runtime.py
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006-MCP"

  order007-core-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: pytest tests/unit/test_order007_correctness.py
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order007_evidence.py "$RUNNER_TEMP/ORDER-007"
      - env: {OPENAI_API_KEY: ""}
        run: python scripts/order007_mcp_e2e.py "$RUNNER_TEMP/ORDER-007"
      - name: Assert F032 through F037 executable evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ORDER-007"
          required = [
              "VERIFIER_AUTHORITY_BINDING.json",
              "CLAIM_IDENTITY_LINEAGE.json",
              "CLAIM_MARKET_NOVELTY.json",
              "HIERARCHY_COMPLETE_EXECUTION.json",
              "REMOVAL_ATTRIBUTION.json",
              "RUNTIME_CORE_LOCK.json",
              "MCP_E2E.json",
          ]
          for name in required:
              payload = json.loads((root / name).read_text())
              assert payload["pass"] is True, name
          assert json.loads((root / "HIERARCHY_COMPLETE_EXECUTION.json").read_text())["incomplete_status"] == "inconclusive"
          assert json.loads((root / "MCP_E2E.json").read_text())["legacy_escape_fields_exposed"] == []
          print("ORDER007_F032_F037_MCP=PASS")
          PY

  benchmark-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: mimicus benchmark --profile offline --episodes 200 --output-dir "$RUNNER_TEMP/benchmark"
      - name: Assert neutral benchmark and all-five morphology coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "benchmark" / "BENCHMARK.json").read_text())
          required = {"solo","paired_verify","parallel_fanout","sparse_graph","hierarchical_fanout_fanin"}
          assert report["episodes_per_architecture"] == 200
          assert report["total_architecture_episodes"] == 1000
          assert report["anti_rigging"]["passed"] is True
          assert report["leakage_probe"]["passed"] is True
          assert report["metrics"]["E"]["avg_simulated_cost"] > 0
          assert required <= set(report["morphology_distribution"]["classes"])
          print("ORDER007_BENCHMARK=PASS")
          PY
      - name: Verify committed ORDER-007 evidence manifest and shape
        shell: bash
        run: |
          test -s evidence/ORDER-007/MANIFEST.sha256
          (cd evidence/ORDER-007 && sha256sum -c MANIFEST.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence/ORDER-007")
          required = [
              "REMOTE_TRUTH.md","AUD_FINDINGS_CLOSURE.md",
              "VERIFIER_AUTHORITY_BINDING.json","CLAIM_IDENTITY_LINEAGE.json",
              "CLAIM_MARKET_NOVELTY.json","HIERARCHY_COMPLETE_EXECUTION.json",
              "REMOVAL_ATTRIBUTION.json","RUNTIME_CORE_LOCK.json","REGRESSION_F001_F031.txt",
              "MCP_E2E.json","TEST_RESULTS.txt","BENCHMARK.json","BENCHMARK_RAW.jsonl","MANIFEST.sha256",
          ]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          assert not missing, missing
          for name in [
              "VERIFIER_AUTHORITY_BINDING.json","CLAIM_IDENTITY_LINEAGE.json",
              "CLAIM_MARKET_NOVELTY.json","HIERARCHY_COMPLETE_EXECUTION.json",
              "REMOVAL_ATTRIBUTION.json","RUNTIME_CORE_LOCK.json","MCP_E2E.json",
          ]:
              assert json.loads((root / name).read_text())["pass"] is True, name
          benchmark = json.loads((root / "BENCHMARK.json").read_text())
          required_morph = {"solo","paired_verify","parallel_fanout","sparse_graph","hierarchical_fanout_fanin"}
          assert benchmark["episodes_per_architecture"] == 200
          assert benchmark["total_architecture_episodes"] == 1000
          assert benchmark["anti_rigging"]["passed"] and benchmark["leakage_probe"]["passed"]
          assert required_morph <= set(benchmark["morphology_distribution"]["classes"])
          print("ORDER007_COMMITTED_EVIDENCE=PASS")
          PY

  migration-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: SQLite clean prior upgrade and PostgreSQL compile
        shell: bash
        run: |
          export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order008-clean.db"
          mimicus db upgrade
          export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order008-from-order002.db"
          alembic upgrade 0001_order002
          alembic upgrade head
          python - <<'PY'
          from mimicus.storage.postgres_compat import compile_postgres_schema
          d = compile_postgres_schema()
          required = {
              "runs","verification_receipts","receipt_attributions","pairwise_cofailure",
              "pair_episode_updates","agent_marginal_value","receipt_germinal_outcomes",
              "verifier_authorities","removal_attributions","progress_ledgers",
          }
          assert required <= set(d), sorted(required - set(d))
          print("POSTGRESQL_ORDER008_SCHEMA_COMPILE=PASS")
          PY
      - run: python -m build
      - run: |
          python -m venv "$RUNNER_TEMP/order008-wheel"
          "$RUNNER_TEMP/order008-wheel/bin/python" -m pip install -r requirements.lock
          "$RUNNER_TEMP/order008-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/order008-wheel/bin/mimicus" doctor --profile offline
