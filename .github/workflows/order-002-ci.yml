name: ORDER-004 source formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-004-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff format .
      - run: ruff check --fix .
      - run: git diff --check
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-004: normalize source formatting'
          git push origin HEAD:order-002-mimicus-v01
