name: ORDER-004 exact-head CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: order-004-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mimicus
      - run: pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90

  security-regression-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/check_security.py
      - run: python scripts/check_ledger.py
      - run: python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
      - run: python scripts/order004_evidence.py "$RUNNER_TEMP/ORDER-004"
      - run: python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"

  benchmark-200-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: mimicus benchmark --profile offline --episodes 200 --output-dir "$RUNNER_TEMP/benchmark"
      - run: python -c "import json, pathlib; p=pathlib.Path('$RUNNER_TEMP/benchmark/BENCHMARK.json'); r=json.loads(p.read_text()); assert r['episodes_per_architecture']==200; assert r['total_architecture_episodes']==1000; assert r['anti_rigging']['passed']; assert r['leakage_probe']['passed']; assert r['metrics']['E']['avg_simulated_cost']>0; print(r['morphology_distribution'])"
      - name: Verify committed ORDER-004 evidence when present
        shell: bash
        run: |
          if [[ -f evidence/ORDER-004/MANIFEST.sha256 ]]; then
            (cd evidence/ORDER-004 && sha256sum -c MANIFEST.sha256)
            test -f evidence/ORDER-004/BENCHMARK_RAW.jsonl
            test -f evidence/ORDER-004/BENCHMARK_MORPHOLOGY_DISTRIBUTION.json
            test -f evidence/ORDER-004/AUD_FINDINGS_CLOSURE.md
          else
            echo "ORDER004_EVIDENCE_NOT_MATERIALIZED_YET"
          fi

  migration-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: SQLite and PostgreSQL schema compatibility
        shell: bash
        run: |
          export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order004-clean.db"
          mimicus db upgrade
          export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order004-from-order002.db"
          alembic upgrade 0001_order002
          alembic upgrade head
          python -c "from mimicus.storage.postgres_compat import compile_postgres_schema; d=compile_postgres_schema(); assert len(d)>=19 and 'CREATE TABLE runs' in d['runs']; print('POSTGRES_SCHEMA_COMPILE=PASS')"
      - run: python -m build
