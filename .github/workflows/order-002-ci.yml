name: ORDER-004 core patch bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-004-core-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-core:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic ORDER-004 core patch
        run: python scripts/order004_core_patch.py
      - name: Restore normal CI and remove bootstrap tooling
        run: |
          git show bd9281cdc0a227c0e3ac2b1f62ba5b4c2f3562e8:.github/workflows/order-002-ci.yml > .github/workflows/order-002-ci.yml
          git rm -f scripts/order004_core_patch.py .github/workflows/order004-core-patch.yml
          git diff --check
      - name: Commit on same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-004: integrate epistemic correctness core'
          git push origin HEAD:order-002-mimicus-v01
