name: ORDER-004 fix bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-004-fix-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/order004_fix1.py
      - run: |
          cat > .github/workflows/order-002-ci.yml <<'EOF'
          name: ORDER-004 development validation

          on:
            pull_request:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: order-004-dev-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            PYTHONUNBUFFERED: "1"
            PIP_DISABLE_PIP_VERSION_CHECK: "1"

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with: {python-version: "3.12"}
                - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
                - run: ruff format --check .
                - run: ruff check .
                - run: mypy src/mimicus
            tests:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with: {python-version: "3.12"}
                - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
                - run: pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90
            security-e2e:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with: {python-version: "3.12"}
                - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
                - run: python scripts/check_security.py
                - run: python scripts/check_ledger.py
                - run: python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
          EOF
          git rm scripts/order004_fix1.py
          ruff format src/mimicus/orchestration/morphology.py src/mimicus/orchestration/engine.py src/mimicus/benchmark.py || true
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-004: fix regression and typing compatibility'
          git push origin HEAD:order-002-mimicus-v01
