name: ORDER-004 development validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: order-004-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mimicus
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90
  security-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/check_security.py
      - run: python scripts/check_ledger.py
      - run: python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
