name: ORDER-005 audit probe validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  order005-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/order005_evidence.py "$RUNNER_TEMP/ORDER-005"
      - run: python scripts/order005_mcp_e2e.py "$RUNNER_TEMP/ORDER-005"
      - run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ORDER-005"
          required = {
              "NO_SYNTHETIC_RUNTIME_EVIDENCE.json",
              "IDENTITY_FINGERPRINT_RECOMPUTE.json",
              "PROVIDER_EVIDENCE_BINDING.json",
              "SKILL_CONDITIONAL_AUTHORITY.json",
              "PROVIDER_CAPABILITY_TRUTH.json",
              "ONLINE_COST_PREFLIGHT.json",
              "MCP_RUNTIME_EVIDENCE_E2E.json",
              "EVIDENCE_RESTART_RESOLUTION.json",
              "MCP_E2E.json",
          }
          missing = sorted(name for name in required if not (root / name).exists())
          assert not missing, missing
          print("ORDER005_REQUIRED_PROBES=PASS")
          PY

  quality-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mimicus
      - run: pytest tests/unit/test_order005_correctness.py tests/integration/test_order005_runtime.py
      - run: python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
      - run: python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"
