name: ORDER-005 compatibility bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-005-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ruff==0.16.3
      - run: python scripts/order005_compat_patch.py
      - run: |
          ruff format src tests scripts
          ruff check --fix src tests scripts
          git rm -f scripts/order005_compat_patch.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-005: migrate historical probes to explicit evidence truth'
          git push origin HEAD:order-002-mimicus-v01
