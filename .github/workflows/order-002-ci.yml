name: ORDER-005 format bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ruff==0.16.3
      - run: ruff format scripts/order005_evidence.py scripts/order005_mcp_e2e.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/order005_evidence.py scripts/order005_mcp_e2e.py
          git commit -m 'ORDER-005: format executable evidence scripts'
          git push origin HEAD:order-002-mimicus-v01
