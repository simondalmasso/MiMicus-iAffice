name: ORDER-004 fix bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-004-fix-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/order004_fix1.py
      - run: |
          git rm scripts/order004_fix1.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/mimicus scripts
          git commit -m 'ORDER-004: fix regression and typing compatibility'
          git push origin HEAD:order-002-mimicus-v01
