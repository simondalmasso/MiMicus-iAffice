name: ORDER-008 recovery repair

on:
  push:
    branches: [order-002-mimicus-v01]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore legacy provider-ref telemetry without weakening projection truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/mimicus/orchestration/production_core.py')
          text = p.read_text(encoding='utf-8')
          needle = '''        usage["provider_claimed_evidence_refs"] = list(record["response"].get("provider_claimed_evidence_refs", []))
        usage["validated_evidence_refs"] = list(record["response"].get("validated_evidence_refs", []))
        usage["rejected_evidence_refs"] = list(record["response"].get("rejected_evidence_refs", []))
'''
          replacement = '''        provider_claimed = list(record["response"].get("provider_claimed_evidence_refs", []))
        validated_refs = list(record["response"].get("validated_evidence_refs", []))
        rejected_refs = list(record["response"].get("rejected_evidence_refs", []))
        # Preserve ORDER-005 raw/validated/rejected telemetry while retaining
        # ORDER-008 exact projection telemetry. Raw claims are never fabricated.
        usage["evidence_refs_claimed"] = provider_claimed
        usage["evidence_refs_validated"] = validated_refs
        usage["evidence_refs_rejected"] = rejected_refs
        usage["provider_claimed_evidence_refs"] = provider_claimed
        usage["validated_evidence_refs"] = validated_refs
        usage["rejected_evidence_refs"] = rejected_refs
'''
          if needle not in text:
              raise SystemExit('projection telemetry restoration snippet missing')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Install and format
        shell: bash
        run: |
          python -m pip install -r requirements.lock >/dev/null
          python -m pip install --no-deps -e . >/dev/null
          ruff format src/mimicus/orchestration/production_core.py tests/unit/test_order008_f041.py
          ruff format --check .
          ruff check .
          mypy src/mimicus/orchestration/production_core.py
      - name: Focused regression and F039-F041 gates
        shell: bash
        run: |
          pytest -q tests/integration/test_order005_runtime.py::test_provider_refs_are_bound_to_supplied_evidence_and_resolve_after_restart
          pytest -q tests/unit/test_order008_f039.py tests/unit/test_order008_f040.py tests/unit/test_order008_f041.py
      - name: Commit repaired branch and remove temporary workflows
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -f .github/workflows/order008-recovery.yml .github/workflows/order008-diagnostics.yml .github/workflows/order008-f039-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ORDER-008: preserve provider-ref telemetry and format F041'
          git push origin HEAD:order-002-mimicus-v01
