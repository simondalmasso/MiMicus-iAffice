name: ORDER-007 F034 compatibility finalize
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'order-002-mimicus-v01' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Apply authenticated compatibility and F034 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Reapply the compatibility changes that were intentionally guarded
          # from commit until all static/semantic gates pass.
          source = Path('.github/workflows/order007-compat-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'order007-compat-fix', 'exec'))
          for name in ('scripts/order006_evidence.py', 'tests/integration/test_order006_runtime.py'):
              path = Path(name)
              text = path.read_text().replace('for index, claim in enumerate(result.final_claims):', 'for claim in result.final_claims:')
              path.write_text(text)

          # Static type fixes found by the guarded lane.
          p = Path('src/mimicus/storage/swarm_state.py')
          s = p.read_text()
          old = '                        key = (a, b, domain, capability)\n                        pair_acc[key]["episodes"] += 1\n                        pair_acc[key]["cofailures"] += int(not left_outcome and not right_outcome)\n                        pair_acc[key]["independent"] += int(left_outcome != right_outcome)\n'
          new = '                        pair_key = (a, b, domain, capability)\n                        pair_acc[pair_key]["episodes"] += 1\n                        pair_acc[pair_key]["cofailures"] += int(not left_outcome and not right_outcome)\n                        pair_acc[pair_key]["independent"] += int(left_outcome != right_outcome)\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/mimicus/orchestration/swarm_core.py')
          s = p.read_text()
          old = '                payload = {"claims": visible, "subtask_hashes": [subtask_assignment[parent].hash for parent in node.prerequisites if parent in subtask_assignment]}\n                subgroup_results[node.group] = payload\n                return payload\n'
          new = '                subgroup_payload: dict[str, Any] = {"claims": visible, "subtask_hashes": [subtask_assignment[parent].hash for parent in node.prerequisites if parent in subtask_assignment]}\n                subgroup_results[node.group] = subgroup_payload\n                return subgroup_payload\n'
          assert old in s
          s = s.replace(old, new, 1)

          # F034: the full safe registry is claim-driven, but an accepted promoted
          # child supersedes its exact ancestor. This preserves the full registry
          # across unrelated families while preventing parent+child duplicate spend.
          old_registry = '''    builtins = host.services.falsifiers.specs(domain)\n    promoted = host.repository.promoted_falsifiers(domain)\n    registry_by_hash = {spec.hash: spec for spec in [*builtins.values(), *promoted]}\n    candidate_specs = sorted(registry_by_hash.values(), key=lambda spec: spec.hash)\n    promoted_hashes = {row.hash for row in promoted}\n    persistent_falsifiers_reused = [spec.hash for spec in candidate_specs if spec.hash in promoted_hashes]\n'''
          new_registry = '''    builtins = host.services.falsifiers.specs(domain)\n    promoted = host.repository.promoted_falsifiers(domain)\n    registry_by_hash = {spec.hash: spec for spec in [*builtins.values(), *promoted]}\n    superseded_hashes = {spec.parent_hash for spec in promoted if spec.parent_hash}\n    candidate_specs = sorted(\n        (spec for spec in registry_by_hash.values() if spec.hash not in superseded_hashes),\n        key=lambda spec: spec.hash,\n    )\n    promoted_hashes = {row.hash for row in promoted}\n    persistent_falsifiers_reused = [spec.hash for spec in candidate_specs if spec.hash in promoted_hashes]\n    if superseded_hashes:\n        ledger.append(\n            "falsifier_registry_lineage_superseded",\n            {"suppressed_ancestor_hashes": sorted(superseded_hashes), "active_registry_hashes": [spec.hash for spec in candidate_specs]},\n        )\n'''
          assert old_registry in s
          s = s.replace(old_registry, new_registry, 1)
          p.write_text(s)

          # F034/F014 shared near-duplicate threshold. With the signature weights,
          # 0.75 means same primitive+trigger+oracle already counts as a substitute
          # even when a nearby numeric parameter lands in an adjacent coarse band.
          p = Path('src/mimicus/falsifiers/market.py')
          s = p.read_text()
          assert s.count('closest >= 0.80') == 2
          s = s.replace('closest >= 0.80', 'closest >= 0.75')
          p.write_text(s)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Static semantic and historical targeted gates
        shell: bash
        run: |
          ruff format src/mimicus tests scripts
          ruff check src/mimicus tests scripts
          mypy src/mimicus
          pytest tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py
          pytest tests/unit tests/integration -k 'falsifier or proximity or novelty or order004' --maxfail=1
          python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
          python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
          python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006-MCP"
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus tests scripts
          git diff --cached --check
          git commit -m 'ORDER-007: enforce authenticated lineage-safe swarm learning'
          git push origin HEAD:order-002-mimicus-v01
