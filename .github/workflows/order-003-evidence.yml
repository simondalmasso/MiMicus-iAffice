name: ORDER-005 evidence materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-005-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Detect existing ORDER-005 evidence
        id: evidence_state
        shell: bash
        run: |
          if [[ -f evidence/ORDER-005/MANIFEST.sha256 ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            (cd evidence/ORDER-005 && sha256sum -c MANIFEST.sha256)
            echo "ORDER005_EVIDENCE_ALREADY_PRESENT=YES"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        with: {python-version: "3.12"}
      - name: Install exact environment
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Quality, coverage, security and historical regression evidence
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/ORDER-005
          {
            echo "ORDER_005_TEST_RESULTS"
            echo "SOURCE_HEAD=$(git rev-parse HEAD)"
            ruff format --check .
            ruff check .
            mypy src/mimicus
            pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90
            python scripts/check_security.py
            python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
            python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"
          } 2>&1 | tee evidence/ORDER-005/TEST_RESULTS.txt
          python scripts/check_ledger.py > evidence/ORDER-005/LEDGER_VERIFY.json
      - name: F018 through F022 executable evidence
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        env:
          OPENAI_API_KEY: ""
        run: python scripts/order005_evidence.py evidence/ORDER-005
      - name: Public MCP runtime evidence and restart
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        env:
          OPENAI_API_KEY: ""
        run: python scripts/order005_mcp_e2e.py evidence/ORDER-005
      - name: Neutral benchmark 200 per architecture
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        run: mimicus benchmark --profile offline --episodes 200 --output-dir evidence/ORDER-005
      - name: Migration, package and doctor truth
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order005-clean.db"
            mimicus db upgrade
            export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order005-from-order002.db"
            alembic upgrade 0001_order002
            alembic upgrade head
            python -c "from mimicus.storage.postgres_compat import compile_postgres_schema; d=compile_postgres_schema(); assert len(d)>=19 and 'CREATE TABLE runs' in d['runs']; print('POSTGRESQL_SCHEMA_COMPILE=PASS')"
            python -m build
            mimicus doctor --profile offline
            MIMICUS_OPENAI_MODEL=gpt-5-mini mimicus doctor --profile openai
          } 2>&1 | tee evidence/ORDER-005/PACKAGE_MIGRATION_DOCTOR.txt
      - name: Metadata and audit closure
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          cat > evidence/ORDER-005/REMOTE_TRUTH.md <<EOF
          # ORDER-005 remote truth

          - Audited starting head: \`1622a67b69737f4dc623bf7df0b9dfb6ac9d77da\`
          - Evidence source head: \`$SOURCE_HEAD\`
          - Branch: \`order-002-mimicus-v01\`
          - PR: \`#3\`
          - Main baseline: \`2d50fd91f4346618acfa87928987e131f54159c7\`
          - No new PR. No merge.
          EOF
          cat > evidence/ORDER-005/AUD_FINDINGS_CLOSURE.md <<'EOF'
          # ORDER-005 audit findings closure

          | Finding | Closure | Evidence |
          |---|---|---|
          | F018 synthetic runtime evidence | runtime has no task-word fixture synthesis; explicit runtime/fixture/benchmark lanes; missing evidence fails inconclusive | `NO_SYNTHETIC_RUNTIME_EVIDENCE.json` |
          | F019 identity integrity | one material manifest binds provider/model/runtime/phenotype/prompt/tools/policy/adapter; persistence rejects mismatch and inspection recomputes | `IDENTITY_FINGERPRINT_RECOMPUTE.json` |
          | F020 evidence binding | bounded canonical caller evidence reaches provider; memory remains separate; only supplied refs survive; unknown refs are rejected/logged; restart resolves persisted refs | `PROVIDER_EVIDENCE_BINDING.json`, `EVIDENCE_RESTART_RESOLUTION.json` |
          | F021 skill-conditional authority | calibration, bankruptcy, routing and challenge reliability consume capability/test-family direct trust rather than positive domain aggregate transfer | `SKILL_CONDITIONAL_AUTHORITY.json` |
          | F022 provider/cost truth | tool support equals configured tools and changes tool-manifest identity; doctor exposes actual capability; unknown multi-call pricing preflights before paid execution and known insufficient budget degrades before calls | `PROVIDER_CAPABILITY_TRUTH.json`, `ONLINE_COST_PREFLIGHT.json` |

          F001..F017 regression is rerun in `TEST_RESULTS.txt`. Public MCP evidence/no-evidence/restart is in `MCP_RUNTIME_EVIDENCE_E2E.json`. Benchmark remains execution-derived and architecture-blind.
          EOF
          cat > evidence/ORDER-005/OPENAI_LIVE_SMOKE.txt <<'EOF'
          OPENAI_LIVE_SMOKE=NOT_RUN_NO_CREDENTIAL
          Mocked OpenAI adapter evidence binding, truthful tool capability and cost-preflight paths are normative offline gates.
          EOF
      - name: Validate required evidence and build manifest
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in REMOTE_TRUTH.md AUD_FINDINGS_CLOSURE.md NO_SYNTHETIC_RUNTIME_EVIDENCE.json IDENTITY_FINGERPRINT_RECOMPUTE.json PROVIDER_EVIDENCE_BINDING.json SKILL_CONDITIONAL_AUTHORITY.json PROVIDER_CAPABILITY_TRUTH.json ONLINE_COST_PREFLIGHT.json MCP_RUNTIME_EVIDENCE_E2E.json EVIDENCE_RESTART_RESOLUTION.json BENCHMARK.json BENCHMARK_RAW.jsonl BENCHMARK_ANTI_RIGGING.json BENCHMARK_LEAKAGE.json MCP_E2E.json LEDGER_VERIFY.json TEST_RESULTS.txt OPENAI_LIVE_SMOKE.txt; do
            test -s "evidence/ORDER-005/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence/ORDER-005")
          for name in ["NO_SYNTHETIC_RUNTIME_EVIDENCE.json", "IDENTITY_FINGERPRINT_RECOMPUTE.json", "PROVIDER_EVIDENCE_BINDING.json", "SKILL_CONDITIONAL_AUTHORITY.json", "PROVIDER_CAPABILITY_TRUTH.json", "ONLINE_COST_PREFLIGHT.json", "MCP_RUNTIME_EVIDENCE_E2E.json", "EVIDENCE_RESTART_RESOLUTION.json", "MCP_E2E.json"]:
              assert json.loads((root / name).read_text())["pass"] is True, name
          benchmark = json.loads((root / "BENCHMARK.json").read_text())
          assert benchmark["episodes_per_architecture"] == 200
          assert benchmark["total_architecture_episodes"] == 1000
          assert benchmark["anti_rigging"]["passed"] and benchmark["leakage_probe"]["passed"]
          print("ORDER005_EVIDENCE_SHAPE=PASS")
          PY
          (
            cd evidence/ORDER-005
            find . -maxdepth 1 -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done
          ) > evidence/ORDER-005/MANIFEST.sha256
          (cd evidence/ORDER-005 && sha256sum -c MANIFEST.sha256)
      - name: Commit ORDER-005 evidence on same branch
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ORDER-005
          git diff --cached --check
          git commit -m 'ORDER-005: materialize exact audit evidence'
          git push origin HEAD:order-002-mimicus-v01
