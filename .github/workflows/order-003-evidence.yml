name: ORDER-006 evidence materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: order-006-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Detect existing ORDER-006 evidence
        id: evidence_state
        shell: bash
        run: |
          if [[ -f evidence/ORDER-006/MANIFEST.sha256 ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            (cd evidence/ORDER-006 && sha256sum -c MANIFEST.sha256)
            echo "ORDER006_EVIDENCE_ALREADY_PRESENT=YES"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        with: {python-version: "3.12"}
      - name: Install exact environment
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Quality coverage security and historical regression evidence
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/ORDER-006
          {
            echo "ORDER_006_TEST_RESULTS"
            echo "SOURCE_HEAD=$(git rev-parse HEAD)"
            ruff format --check .
            ruff check .
            mypy src/mimicus
            pytest tests/unit tests/integration --cov=mimicus --cov-report=term-missing --cov-fail-under=90
            python scripts/check_security.py
            python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
            python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"
          } 2>&1 | tee evidence/ORDER-006/TEST_RESULTS.txt
          python scripts/check_ledger.py > evidence/ORDER-006/LEDGER_VERIFY.json
      - name: F023 through F031 executable evidence
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        env:
          OPENAI_API_KEY: ""
        run: python scripts/order006_evidence.py evidence/ORDER-006
      - name: MCP receipt learning and restart evidence
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        env:
          OPENAI_API_KEY: ""
        run: python scripts/order006_mcp_e2e.py evidence/ORDER-006
      - name: Neutral benchmark 200 per architecture
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        run: mimicus benchmark --profile offline --episodes 200 --output-dir evidence/ORDER-006
      - name: Migration package and offline doctor truth
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order006-clean.db"
            mimicus db upgrade
            export MIMICUS_DATABASE_URL="sqlite:///$RUNNER_TEMP/order006-from-order002.db"
            alembic upgrade 0001_order002
            alembic upgrade head
            python - <<'PY'
          from mimicus.storage.postgres_compat import compile_postgres_schema
          d = compile_postgres_schema()
          required = {
              'runs', 'verification_receipts', 'receipt_attributions',
              'pairwise_cofailure', 'pair_episode_updates',
              'agent_marginal_value', 'receipt_germinal_outcomes'
          }
          assert required <= set(d), sorted(set(required) - set(d))
          print('POSTGRESQL_ORDER006_SCHEMA_COMPILE=PASS')
          PY
            python -m build
            mimicus doctor --profile offline
          } 2>&1 | tee evidence/ORDER-006/PACKAGE_MIGRATION_DOCTOR.txt
      - name: Metadata and audit closure
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          cat > evidence/ORDER-006/REMOTE_TRUTH.md <<EOF
          # ORDER-006 remote truth

          - Audited starting head: \`d1de2df8c52ccac9f06029950fad7b7da4673f55\`
          - Evidence source head: \`$SOURCE_HEAD\`
          - Branch: \`order-002-mimicus-v01\`
          - PR: \`#3\`
          - Main baseline: \`2d50fd91f4346618acfa87928987e131f54159c7\`
          - ORDER-006 issue: \`#7\`
          - No new PR. No merge. No direct main write.
          - OpenAI live work: deferred out of scope.
          EOF
          cat > evidence/ORDER-006/AUD_FINDINGS_CLOSURE.md <<'EOF'
          # ORDER-006 audit findings closure

          | Finding | Runtime closure | Executable evidence |
          |---|---|---|
          | F023 real hidden micro-auditions | typed provider audition path; Scripted executes hidden canaries; deterministic scorer; unsupported providers neutral; paid auditions use the unified budget ledger | `REAL_MICRO_AUDITIONS.json` |
          | F024 verified adjudication | immutable hash-bound receipts, accepted authority classes, origin dedup, claim/run binding, exact contributor capability attribution, CLI/MCP submission | `VERIFICATION_RECEIPTS.json`, `MCP_E2E.json` |
          | F025 runtime germinal loop | verified receipt contradicting persisted falsifier execution creates safe declarative mutation, fossil adjudication, persisted promotion/rejection and restart reuse | `RUNTIME_GERMINAL_LOOP.json`, `MCP_E2E.json` |
          | F026 claim-aware falsifier market | market runs after sealed first-pass claims and records target claim hashes plus selection reason | `CLAIM_AWARE_FALSIFIER_MARKET.json` |
          | F027 real synthesis | typed `SwarmDecision` returns candidate content separately from epistemic status and changes under linked falsifier evidence | `SWARM_DECISION_SYNTHESIS.json` |
          | F028 genuine hierarchy | deterministic typed subtasks with distinct objectives/hashes are assigned to workers and nested fan-in is executed | `HIERARCHICAL_SUBTASKS.json` |
          | F029 cofailure and marginal value | verified receipts persist pair cofailure and marginal signals; restart changes future coalition toward independent alternative | `COFAILURE_ATTRIBUTION.json` |
          | F030 all five morphologies | all five runtime semantics are reachable; 200-episode architecture E benchmark exercises all five without force flags | `MORPHOLOGY_ALL_FIVE.json`, `BENCHMARK_MORPHOLOGY_DISTRIBUTION.json`, `BENCHMARK.json` |
          | F031 structural threat profiling | evidence schema, prior verified failures, available capability/budget/concurrency and weak lexical signals are provenance-recorded; cosmetic wording invariance holds | `THREAT_PROFILE_STRUCTURAL.json` |

          F001..F022 historical gates, security, ledger, coverage, migration and package evidence are rerun in `TEST_RESULTS.txt`, `LEDGER_VERIFY.json` and `PACKAGE_MIGRATION_DOCTOR.txt`.
          EOF
      - name: Validate required evidence and build manifest
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in REMOTE_TRUTH.md AUD_FINDINGS_CLOSURE.md REAL_MICRO_AUDITIONS.json VERIFICATION_RECEIPTS.json RUNTIME_GERMINAL_LOOP.json CLAIM_AWARE_FALSIFIER_MARKET.json SWARM_DECISION_SYNTHESIS.json HIERARCHICAL_SUBTASKS.json COFAILURE_ATTRIBUTION.json MORPHOLOGY_ALL_FIVE.json THREAT_PROFILE_STRUCTURAL.json PERSISTENCE_RESTART.json LEDGER_VERIFY.json MCP_E2E.json BENCHMARK.json BENCHMARK_RAW.jsonl TEST_RESULTS.txt PACKAGE_MIGRATION_DOCTOR.txt ORDER006_E2E.json; do
            test -s "evidence/ORDER-006/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/ORDER-006')
          for name in [
              'REAL_MICRO_AUDITIONS.json','VERIFICATION_RECEIPTS.json','RUNTIME_GERMINAL_LOOP.json',
              'CLAIM_AWARE_FALSIFIER_MARKET.json','SWARM_DECISION_SYNTHESIS.json','HIERARCHICAL_SUBTASKS.json',
              'COFAILURE_ATTRIBUTION.json','MORPHOLOGY_ALL_FIVE.json','THREAT_PROFILE_STRUCTURAL.json',
              'PERSISTENCE_RESTART.json','MCP_E2E.json'
          ]:
              assert json.loads((root / name).read_text())['pass'] is True, name
          order = json.loads((root / 'ORDER006_E2E.json').read_text())
          assert order['passed'] is True
          benchmark = json.loads((root / 'BENCHMARK.json').read_text())
          required = {'solo','paired_verify','parallel_fanout','sparse_graph','hierarchical_fanout_fanin'}
          assert benchmark['episodes_per_architecture'] == 200
          assert benchmark['total_architecture_episodes'] == 1000
          assert benchmark['anti_rigging']['passed'] and benchmark['leakage_probe']['passed']
          assert required <= set(benchmark['morphology_distribution']['classes'])
          assert benchmark['metrics']['E']['avg_simulated_cost'] > 0
          print('ORDER006_EVIDENCE_SHAPE=PASS')
          PY
          (
            cd evidence/ORDER-006
            find . -maxdepth 1 -type f ! -name MANIFEST.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done
          ) > evidence/ORDER-006/MANIFEST.sha256
          (cd evidence/ORDER-006 && sha256sum -c MANIFEST.sha256)
      - name: Commit ORDER-006 evidence on same branch
        if: ${{ steps.evidence_state.outputs.generate == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ORDER-006
          git diff --cached --check
          git commit -m 'ORDER-006: materialize exact audit evidence'
          git push origin HEAD:order-002-mimicus-v01
