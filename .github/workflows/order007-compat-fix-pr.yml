name: ORDER-007 authenticated compatibility PR lane
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'order-002-mimicus-v01' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Execute canonical compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/order007-compat-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'order007-compat-fix', 'exec'))
          for name in ('scripts/order006_evidence.py', 'tests/integration/test_order006_runtime.py'):
              path = Path(name)
              text = path.read_text().replace('for index, claim in enumerate(result.final_claims):', 'for claim in result.final_claims:')
              path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Format and static gate
        run: |
          ruff format src/mimicus/interfaces/cli.py src/mimicus/storage/swarm_state.py src/mimicus/verification/service.py src/mimicus/validation/order003_worker.py tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py scripts/order006_evidence.py scripts/order006_mcp_e2e.py
          ruff check src/mimicus/interfaces/cli.py src/mimicus/storage/swarm_state.py src/mimicus/verification/service.py src/mimicus/validation/order003_worker.py tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py scripts/order006_evidence.py scripts/order006_mcp_e2e.py
          mypy src/mimicus
      - name: Targeted authenticated regressions
        run: |
          pytest tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py
          python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
          python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
          python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006-MCP"
      - name: Commit compatibility fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus tests scripts
          git diff --cached --check
          git commit -m 'ORDER-007: authenticate historical verification regressions'
          git push origin HEAD:order-002-mimicus-v01
