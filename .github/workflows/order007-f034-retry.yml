name: ORDER-007 lineage compatibility retry
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'order-002-mimicus-v01' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Apply prior verified patch and explicit fixture compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/order007-f034-finalize.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'order007-f034-finalize', 'exec'))

          path = Path('tests/integration/test_order003_runtime.py')
          text = path.read_text()
          count = text.count('fixture=')
          assert count >= 5, count
          text = text.replace('fixture=', 'source_mode="fixture", fixture=')
          path.write_text(text)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Full precommit gate
        shell: bash
        run: |
          ruff format src/mimicus tests scripts
          ruff check src/mimicus tests scripts
          mypy src/mimicus
          pytest tests/unit tests/integration --maxfail=1
          python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
          python -m mimicus.validation.e2e "$RUNNER_TEMP/ORDER-002"
          python scripts/order005_evidence.py "$RUNNER_TEMP/ORDER-005"
          python scripts/order005_mcp_e2e.py "$RUNNER_TEMP/ORDER-005-MCP"
          python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
          python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006-MCP"
      - name: Commit verified ORDER-007 compatibility fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus tests scripts
          git diff --cached --check
          git commit -m 'ORDER-007: enforce authenticated lineage-safe swarm learning'
          git push origin HEAD:order-002-mimicus-v01
