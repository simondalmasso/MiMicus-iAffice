name: ORDER-006 evidence diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mimicus
      - run: pytest tests/unit/test_order006_core.py tests/integration/test_order006_runtime.py
      - run: python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
      - run: python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006"
      - run: mimicus benchmark --profile offline --episodes 200 --output-dir "$RUNNER_TEMP/ORDER-006"
      - name: Assert ORDER-006 benchmark morphology coverage
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ORDER-006'
          report = json.loads((root / 'BENCHMARK.json').read_text())
          classes = report['morphology_distribution']['classes']
          required = {'solo','paired_verify','parallel_fanout','sparse_graph','hierarchical_fanout_fanin'}
          print(json.dumps({'classes': classes, 'required': sorted(required)}, sort_keys=True))
          assert report['episodes_per_architecture'] >= 200
          assert report['total_architecture_episodes'] >= 1000
          assert report['anti_rigging']['passed'] is True
          assert report['leakage_probe']['passed'] is True
          assert required <= set(classes)
          PY
