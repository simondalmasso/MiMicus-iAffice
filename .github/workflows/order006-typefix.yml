name: ORDER-006 type-safety patch
on:
  push:
    branches: [order-002-mimicus-v01]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 1
      - name: Apply type-safe ORDER-006 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mimicus/orchestration/synthesis.py')
          text = path.read_text()
          old = '''    if best[3] == "FALSIFIED":\n        status = "FALSIFIED"\n    elif best[3] == "SUPPORTED" and not disagreements and coverage_complete:\n        status = "SUPPORTED"\n    else:\n        status = "INCONCLUSIVE"\n'''
          new = '''    status: Literal["SUPPORTED", "FALSIFIED", "INCONCLUSIVE"]\n    if best[3] == "FALSIFIED":\n        status = "FALSIFIED"\n    elif best[3] == "SUPPORTED" and not disagreements and coverage_complete:\n        status = "SUPPORTED"\n    else:\n        status = "INCONCLUSIVE"\n'''
          assert old in text
          path.write_text(text.replace(old, new))

          path = Path('src/mimicus/storage/swarm_state.py')
          text = path.read_text()
          old = '''            for row in pair_rows:\n                if row.agent_a not in pair or row.agent_b not in pair:\n                    continue\n                confidence = row.verified_episodes / (row.verified_episodes + 5.0)\n                penalty = (row.cofailures / max(1, row.verified_episodes)) * confidence\n                pair[row.agent_a][row.agent_b] = max(pair[row.agent_a].get(row.agent_b, 0.0), penalty)\n                pair[row.agent_b][row.agent_a] = max(pair[row.agent_b].get(row.agent_a, 0.0), penalty)\n'''
          new = '''            for pair_row in pair_rows:\n                if pair_row.agent_a not in pair or pair_row.agent_b not in pair:\n                    continue\n                confidence = pair_row.verified_episodes / (pair_row.verified_episodes + 5.0)\n                penalty = (pair_row.cofailures / max(1, pair_row.verified_episodes)) * confidence\n                pair[pair_row.agent_a][pair_row.agent_b] = max(pair[pair_row.agent_a].get(pair_row.agent_b, 0.0), penalty)\n                pair[pair_row.agent_b][pair_row.agent_a] = max(pair[pair_row.agent_b].get(pair_row.agent_a, 0.0), penalty)\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''            for row in marginal_rows:\n                if row.capability not in capabilities:\n                    continue\n                marginal[row.fingerprint][row.capability] = max(-1.0, min(1.0, row.marginal_sum / (row.verified_episodes + 4.0)))\n'''
          new = '''            for marginal_row in marginal_rows:\n                if marginal_row.capability not in capabilities:\n                    continue\n                marginal[marginal_row.fingerprint][marginal_row.capability] = max(\n                    -1.0, min(1.0, marginal_row.marginal_sum / (marginal_row.verified_episodes + 4.0))\n                )\n'''
          assert old in text
          path.write_text(text.replace(old, new))

          path = Path('src/mimicus/verification/service.py')
          text = path.read_text().replace('from typing import Any\n', 'from typing import Any, cast\n')
          old = '    current_tolerance = float(parent.params.get("relative_tolerance", 0.05))\n'
          new = '    current_tolerance = float(cast(Any, parent.params.get("relative_tolerance", 0.05)))\n'
          assert old in text
          text = text.replace(old, new)
          old = '    metrics = {\n        "reason": decision.reason,\n'
          new = '    metrics: dict[str, Any] = {\n        "reason": decision.reason,\n'
          assert old in text
          path.write_text(text.replace(old, new))

          path = Path('src/mimicus/orchestration/swarm_core.py')
          text = path.read_text()
          old = '''            for member in members:\n                edges.append(DagEdge(member.node_id, join.node_id, "nested_subtask_fanin", join.group))\n'''
          new = '''            for member_node in members:\n                edges.append(DagEdge(member_node.node_id, join.node_id, "nested_subtask_fanin", join.group))\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''                relevant = [cap for cap in profile.required_capabilities if cap in member.capabilities]\n                authority = sum(member.capability_calibration_scores.get(cap, member.calibration_score) for cap in relevant) / max(1, len(relevant))\n                claim_rows.append((fp, claim, authority))\n'''
          new = '''                relevant_caps = [cap for cap in profile.required_capabilities if cap in member.capabilities]\n                authority = sum(\n                    member.capability_calibration_scores.get(cap, member.calibration_score) for cap in relevant_caps\n                ) / max(1, len(relevant_caps))\n                claim_rows.append((fp, claim, authority))\n'''
          assert old in text
          path.write_text(text.replace(old, new))

          path = Path('src/mimicus/orchestration/engine.py')
          text = path.read_text()
          old = '''class MiMicusEngine(LegacyMiMicusEngine):\n    async def run_async(self, request: RunRequest) -> RunResult:\n        use_core = (\n            request.core_semantics if request.core_semantics is not None else request.source_mode == "benchmark" or (request.source_mode == "runtime" and not request.fixture)\n        )\n        if use_core:\n            return RunResult.model_validate(await execute_swarm_core(self, request))\n        legacy = await super().run_async(request)\n'''
          new = '''class MiMicusEngine(LegacyMiMicusEngine):\n    async def run_async(self, request: LegacyRunRequest) -> RunResult:\n        core_request = request if isinstance(request, RunRequest) else RunRequest.model_validate(request.model_dump(mode="json"))\n        use_core = (\n            core_request.core_semantics\n            if core_request.core_semantics is not None\n            else core_request.source_mode == "benchmark" or (core_request.source_mode == "runtime" and not core_request.fixture)\n        )\n        if use_core:\n            return RunResult.model_validate(await execute_swarm_core(self, core_request))\n        legacy = await super().run_async(request)\n'''
          assert old in text
          path.write_text(text.replace(old, new))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mimicus
          git commit -m "ORDER-006: make swarm core type-safe"
          git push origin HEAD:order-002-mimicus-v01
