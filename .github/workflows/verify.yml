name: zero-cost-self-hosted-verify
on:
  workflow_dispatch:
  push:
    branches:
      - order-003-zero-cost-compute-market-v1
  pull_request:
    branches:
      - order-002-ariaos-business-os-v1
jobs:
  exact-head:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --offline --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run e2e
      - run: npm run e2e:compute
      - run: npm run benchmark
      - run: npm run benchmark:compute
      - run: npm run chaos:compute
      - run: npm run security
      - run: npm run doctor
