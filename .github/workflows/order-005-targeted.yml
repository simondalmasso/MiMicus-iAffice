name: ORDER-005 targeted closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  targeted-f018-f022:
    if: ${{ github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .

      - name: F018 runtime lexical kill tests
        run: |
          pytest -q \
            tests/unit/test_order005_correctness.py::test_task_words_never_create_fixture_facts \
            tests/integration/test_order005_runtime.py::test_words_only_runtime_cannot_activate_synthetic_evidence
          python scripts/order005_mcp_e2e.py "$RUNNER_TEMP/F018-MCP"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['RUNNER_TEMP'])/'F018-MCP'/'MCP_RUNTIME_EVIDENCE_E2E.json').read_text())
          assert p['words_only']['status'] == 'inconclusive'
          assert p['words_only']['provider_input_evidence_hashes'] == []
          print('F018_TARGETED=PASS')
          PY

      - name: F020 provider evidence binding
        run: |
          pytest -q \
            tests/unit/test_order005_correctness.py::test_evidence_input_rejects_provenance_spoof_and_oversize \
            tests/unit/test_order005_correctness.py::test_runtime_evidence_canonicalizes_hashes_and_authority \
            tests/integration/test_order005_runtime.py::test_provider_refs_are_bound_to_supplied_evidence_and_resolve_after_restart \
            tests/integration/test_order005_runtime.py::test_openai_adapter_receives_canonical_evidence_and_excludes_blocked_memory
          python - <<'PY'
          print('F020_TARGETED=PASS')
          PY

      - name: F021 skill conditional authority
        run: |
          pytest -q \
            tests/unit/test_order005_correctness.py::test_selector_uses_capability_specific_authority_without_positive_transfer \
            tests/integration/test_order005_runtime.py::test_capability_bankruptcy_is_conditional_and_persists
          python - <<'PY'
          print('F021_TARGETED=PASS')
          PY

      - name: F019 identity integrity
        run: |
          pytest -q \
            tests/unit/test_order005_correctness.py::test_material_identity_mutations_change_fingerprint_and_forgery_is_rejected \
            tests/unit/test_order005_correctness.py::test_make_identity_binds_adapter_version
          python - <<'PY'
          print('F019_TARGETED=PASS')
          PY

      - name: F022 capability truth and cost preflight
        run: |
          pytest -q \
            tests/unit/test_order005_correctness.py::test_openai_tool_capability_matches_actual_tools_and_identity \
            tests/integration/test_order005_runtime.py::test_unknown_cost_multicall_preflight_executes_no_partial_swarm \
            tests/integration/test_order005_runtime.py::test_known_cost_preflight_degrades_before_execution
          python - <<'PY'
          print('F022_TARGETED=PASS')
          PY
