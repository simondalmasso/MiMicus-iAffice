name: ORDER-008 runtime hardening one-shot

on:
  push:
    branches: [order-002-mimicus-v01]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime truth hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected snippet missing: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/mimicus/orchestration/swarm_core.py',
              'from mimicus.falsifiers.market import ClaimFalsifierBid, FalsifierMarket\n',
              'from mimicus.falsifiers.market import ClaimFalsifierBid, FalsifierMarket\nfrom mimicus.falsifiers.primitives import execute_claim_bound\n',
          )
          replace(
              'src/mimicus/orchestration/swarm_core.py',
              '    claim_trace_ids: dict[str, str | None] = {}\n    provider_usages: list[dict[str, Any]] = []\n',
              '    claim_trace_ids: dict[str, str | None] = {}\n    claim_context_by_identity: dict[str, dict[str, Any]] = {}\n    provider_usages: list[dict[str, Any]] = []\n',
          )
          replace(
              'src/mimicus/orchestration/swarm_core.py',
              '    async def ensure_market() -> list[ClaimFalsifierBid]:\n',
              '''    def scoped_context(payload: tuple[dict[str, Any], ...]) -> dict[str, Any]:\n        merged: dict[str, Any] = {}\n        conflicts: set[str] = set()\n        for row in payload:\n            facts = row.get("extracted_facts", {})\n            if not isinstance(facts, dict):\n                continue\n            for key, value in facts.items():\n                if key in conflicts:\n                    continue\n                if key in merged and sha256_obj(merged[key]) != sha256_obj(value):\n                    merged.pop(key, None)\n                    conflicts.add(key)\n                else:\n                    merged[key] = value\n        if conflicts:\n            merged["evidence_conflicts"] = sorted(conflicts)\n        return merged\n\n    async def ensure_market() -> list[ClaimFalsifierBid]:\n''',
          )
          replace(
              'src/mimicus/orchestration/swarm_core.py',
              '            claims_by_node[node.node_id] = claim\n            claim_owner_by_node[node.node_id] = member.fingerprint\n',
              '            claims_by_node[node.node_id] = claim\n            claim_context_by_identity[claim.identity_hash] = scoped_context(runtime_payload)\n            claim_owner_by_node[node.node_id] = member.fingerprint\n',
          )
          old = '''            reservation = await budget.reserve("falsifier", spec.estimated_cost, known_zero_cost=spec.estimated_cost == 0.0)\n            if reservation is None:\n                return {"budget_exhausted": True}\n            raw = host.services.falsifiers.run(spec, evidence_context)\n            reason = "; ".join(sorted({bid.selection_reason for bid in relevant}))\n            execution = raw.model_copy(update={"target_claim_hashes": tuple(sorted({bid.target_claim_hash for bid in relevant})), "selection_reason": reason})\n            await budget.reconcile(reservation, execution.cost)\n            executions.append(execution)\n            ledger.append("falsifier_selected", {"spec_hash": spec.hash, "target_claim_hashes": list(execution.target_claim_hashes), "why": reason})\n            ledger.append("falsifier_executed", execution.model_dump(mode="json"))\n            return execution.model_dump(mode="json")\n'''
          new = '''            claim_by_identity = {claim.identity_hash: claim for claim in claims_by_node.values()}\n            node_executions: list[dict[str, Any]] = []\n            for bid in sorted(relevant, key=lambda row: (row.target_claim_hash, row.selection_reason)):\n                claim = claim_by_identity.get(bid.target_claim_hash)\n                if claim is None:\n                    continue\n                reservation = await budget.reserve(\n                    "falsifier",\n                    spec.estimated_cost,\n                    known_zero_cost=spec.estimated_cost == 0.0,\n                )\n                if reservation is None:\n                    continue\n                execution = execute_claim_bound(\n                    spec,\n                    claim,\n                    claim_context_by_identity.get(claim.identity_hash, {}),\n                    evidence_projection_hashes=tuple(claim.evidence_refs),\n                    selection_reason=bid.selection_reason,\n                )\n                await budget.reconcile(reservation, execution.cost)\n                executions.append(execution)\n                node_executions.append(execution.model_dump(mode="json"))\n                ledger.append(\n                    "falsifier_selected",\n                    {\n                        "spec_hash": spec.hash,\n                        "target_claim_hashes": list(execution.target_claim_hashes),\n                        "why": bid.selection_reason,\n                    },\n                )\n                ledger.append("falsifier_executed", execution.model_dump(mode="json"))\n            if not node_executions:\n                return {"budget_exhausted": True}\n            return {"executions": node_executions}\n'''
          replace('src/mimicus/orchestration/swarm_core.py', old, new)

          # Exact provider audit: per-call usage records must identify what the provider actually received.
          needle = '''    for claim_row in result.get("final_claims", []):\n'''
          injection = '''    for usage_row in result.get("evidence_provenance", {}).get("provider_usages", []):\n        trace_id = usage_row.get("trace_id")\n        record = by_trace.get(str(trace_id)) if trace_id is not None else None\n        if record is None:\n            continue\n        exact_hashes = [str(value) for value in record["request"].get("evidence_hashes", [])]\n        projection_hashes = [str(value) for value in record.get("projection_hashes", [])]\n        projection_to_parent = {str(key): str(value) for key, value in record.get("projection_to_parent", {}).items()}\n        usage = usage_row.setdefault("usage", {})\n        usage["evidence_hashes_supplied"] = exact_hashes\n        usage["projection_hashes_supplied"] = projection_hashes\n        usage["parent_evidence_hashes_supplied"] = [projection_to_parent.get(value, value) for value in exact_hashes]\n\n    for claim_row in result.get("final_claims", []):\n'''
          replace('src/mimicus/orchestration/production_core.py', needle, injection)

          # Recompute authoritative executions after all bounded challenge revisions.
          replace(
              'src/mimicus/orchestration/production_core.py',
              '''    executions = _reexecute_claim_bound(host, result, projections_by_claim)\n    communications, round_progress = await _extend_bounded_communication(boundary, result, executions, request)\n    result["persistent_state"]["communications"] = communications\n''',
              '''    executions = _reexecute_claim_bound(host, result, projections_by_claim)\n    communications, round_progress = await _extend_bounded_communication(boundary, result, executions, request)\n    # Challenge rounds may change claim revision hashes. Authoritative falsifier\n    # snapshots must bind the final revision that synthesis and replay consume.\n    executions = _reexecute_claim_bound(host, result, projections_by_claim)\n    result["persistent_state"]["communications"] = communications\n''',
          )
          replace(
              'src/mimicus/orchestration/production_core.py',
              '''    _apply_decision(result, decision, executions)\n\n    parent_hashes = list(result.get("evidence_provenance", {}).get("provider_input_evidence_hashes", []))\n''',
              '''    _apply_decision(result, decision, executions)\n    spec_rows = _spec_index(\n        host,\n        str((result.get("final_claims") or [{}])[0].get("domain") or request.domain or "general"),\n    )\n    persistent_reuse = set(result.get("persistent_falsifiers_reused", []))\n    result["falsifiers"] = [\n        row.model_dump(mode="json")\n        | {\n            "id": spec_rows[row.spec_hash].id if row.spec_hash in spec_rows else None,\n            "primitive": spec_rows[row.spec_hash].primitive if row.spec_hash in spec_rows else None,\n            "persistent_reuse": row.spec_hash in persistent_reuse,\n        }\n        for row in executions\n    ]\n\n    parent_hashes = list(result.get("evidence_provenance", {}).get("provider_input_evidence_hashes", []))\n''',
          )
          # Reuse same spec index for semantic replay later.
          replace(
              'src/mimicus/orchestration/production_core.py',
              '''    specs = _spec_index(host, str((result.get("final_claims") or [{}])[0].get("domain") or request.domain or "general"))\n    semantic = _semantic_record(result, request, boundary, executions, specs)\n''',
              '''    semantic = _semantic_record(result, request, boundary, executions, spec_rows)\n''',
          )
          PY

          python -m pip install -r requirements.lock >/dev/null
          ruff format .
          ruff check . --fix
      - name: Remove one-shot workflow and push
        shell: bash
        run: |
          rm .github/workflows/order008-runtime-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ORDER-008: bind runtime falsification before challenge and final replay'
          git push origin HEAD:order-002-mimicus-v01
