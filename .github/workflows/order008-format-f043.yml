name: ORDER-008 transient formatter F043

on:
  push:
    branches: [order-002-mimicus-v01]

permissions:
  contents: write

jobs:
  patch-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Patch persisted progress exposure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mimicus/storage/repository.py")
          text = path.read_text(encoding="utf-8")
          old = '''            communications: list[str] = []
            evidence_rows: list[str] = []
            if run_id is not None:
                communication_rows = connection.execute(select(CommunicationRow.payload_json).where(CommunicationRow.run_id == run_id)).scalars().all()
                communications = [str(row) for row in communication_rows if row is not None]
                raw_evidence = connection.execute(select(EvidenceRow.payload_json).where(EvidenceRow.run_id == run_id)).scalars().all()
                evidence_rows = [str(row) for row in raw_evidence if row is not None]
'''
          new = '''            communications: list[str] = []
            evidence_rows: list[str] = []
            progress_rows: list[str] = []
            if run_id is not None:
                communication_rows = connection.execute(select(CommunicationRow.payload_json).where(CommunicationRow.run_id == run_id)).scalars().all()
                communications = [str(row) for row in communication_rows if row is not None]
                raw_evidence = connection.execute(select(EvidenceRow.payload_json).where(EvidenceRow.run_id == run_id)).scalars().all()
                evidence_rows = [str(row) for row in raw_evidence if row is not None]
                raw_progress = (
                    connection.execute(
                        select(ProgressLedgerRow.payload_json)
                        .where(ProgressLedgerRow.run_id == run_id)
                        .order_by(ProgressLedgerRow.step, ProgressLedgerRow.id)
                    )
                    .scalars()
                    .all()
                )
                progress_rows = [str(row) for row in raw_progress if row is not None]
'''
          if old not in text:
              raise SystemExit("inspect_state query block no longer matches expected remote truth")
          text = text.replace(old, new, 1)
          old_return = '''            "communications": [json.loads(row) for row in communications if row],
            "evidence": [json.loads(row) for row in evidence_rows if row],
'''
          new_return = '''            "communications": [json.loads(row) for row in communications if row],
            "evidence": [json.loads(row) for row in evidence_rows if row],
            "progress": [json.loads(row) for row in progress_rows if row],
'''
          if old_return not in text:
              raise SystemExit("inspect_state return block no longer matches expected remote truth")
          path.write_text(text.replace(old_return, new_return, 1), encoding="utf-8")
          PY
      - name: Run canonical formatter
        run: ruff format .
      - name: Commit patch and formatter output
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mimicus/storage/repository.py src/mimicus/orchestration/production_core.py tests/integration/test_order008_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(order008): expose progress and apply canonical formatting [order008-bot]"
          git push origin HEAD:order-002-mimicus-v01
