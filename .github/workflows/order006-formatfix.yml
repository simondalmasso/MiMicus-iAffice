name: ORDER-006 Ruff format patch
on:
  push:
    branches: [order-002-mimicus-v01]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ruff==0.16.3
      - run: ruff format src/mimicus/orchestration/swarm_core.py src/mimicus/storage/swarm_state.py src/mimicus/interfaces/cli.py src/mimicus/validation/order003_e2e.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mimicus
          git diff --cached --quiet && exit 0
          git commit -m "ORDER-006: normalize core formatting"
          git push origin HEAD:order-002-mimicus-v01
