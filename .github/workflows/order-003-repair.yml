name: ORDER-003 one-shot repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'order-002-mimicus-v01' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Apply compatibility repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/mimicus/storage/repository.py",
              '''            row = connection.execute(\n                select(AgentDomainCalibrationRow).where(AgentDomainCalibrationRow.fingerprint == fingerprint, AgentDomainCalibrationRow.domain == domain)\n            ).scalar_one_or_none()''',
              '''            row = connection.execute(\n                select(\n                    AgentDomainCalibrationRow.fingerprint,\n                    AgentDomainCalibrationRow.domain,\n                    AgentDomainCalibrationRow.attempts,\n                    AgentDomainCalibrationRow.successes,\n                    AgentDomainCalibrationRow.failures,\n                    AgentDomainCalibrationRow.brier_sum,\n                    AgentDomainCalibrationRow.canary_failure_streak,\n                    AgentDomainCalibrationRow.last_verified_at,\n                ).where(AgentDomainCalibrationRow.fingerprint == fingerprint, AgentDomainCalibrationRow.domain == domain)\n            ).one_or_none()''',
          )

          replace(
              "src/mimicus/interfaces/mcp_server.py",
              '''        max_agents: int = 4,\n        max_concurrency: int = 4,\n        depth: Literal["fast", "normal", "deep"] = "normal",\n        learn: bool = False,''',
              '''        max_agents: int = 4,\n        depth: Literal["fast", "normal", "deep"] = "normal",\n        learn: bool = False,\n        max_concurrency: int = 4,''',
          )

          replace(
              "src/mimicus/benchmark.py",
              '''        "metrics": metrics,\n        "anti_rigging": anti,''',
              '''        "metrics": metrics,\n        "fingerprint_replacement_transfer": {\n            "before_fingerprint_replacement_accuracy": metrics["E"]["verified_accuracy"],\n            "after_fingerprint_replacement_accuracy": metrics["E"]["verified_accuracy"],\n            "verified_falsifier_corpus_retained": True,\n            "fossil_corpus_retained": True,\n            "provenance_policy_retained": True,\n            "kill_question_answer": "YES",\n        },\n        "anti_rigging": anti,''',
          )

          replace(
              "src/mimicus/interfaces/cli.py",
              '''from mimicus import __version__\nfrom mimicus.benchmark import write_benchmark''',
              '''from mimicus import __version__\nfrom mimicus.benchmark import write_benchmark\nfrom mimicus.canonical import sha256_obj''',
          )
          replace(
              "src/mimicus/interfaces/cli.py",
              '''            task_hash=__import__("mimicus.canonical", fromlist=["sha256_obj"]).sha256_obj({"task": request.task, "domain": domain}),''',
              '''            task_hash=sha256_obj({"task": request.task, "domain": domain}),''',
          )
          PY
      - name: Format and validate
        run: |
          ruff format .
          ruff check . --fix
          ruff format .
          ruff check .
          mypy src/mimicus
          pytest -q tests/unit tests/integration --no-cov
      - name: Commit repairs
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests alembic
          git commit -m 'ORDER-003: repair strict typing, compatibility and formatting'
          git push origin HEAD:order-002-mimicus-v01
