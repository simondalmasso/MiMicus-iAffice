name: ORDER-007 authenticated compatibility fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'order-002-mimicus-v01' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-002-mimicus-v01
          fetch-depth: 0
      - name: Apply receipt-gated historical compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # F036: keep the verified target semantic anchor fixed across leave-one-out.
          p = Path('src/mimicus/verification/service.py')
          s = p.read_text()
          s = s.replace(
              'def _verification_utility(claims: list[dict[str, Any]], verified_status: str) -> float:\n    if not claims:\n        return 0.0\n    anchor_statement = str(claims[0].get("statement", ""))',
              'def _verification_utility(claims: list[dict[str, Any]], verified_status: str, anchor_statement: str) -> float:\n    if not claims:\n        return 0.0',
          )
          s = s.replace(
              '    baseline = _verification_utility(target_first, receipt.verified_status)\n',
              '    anchor_statement = str(target_claim.get("statement", ""))\n    baseline = _verification_utility(target_first, receipt.verified_status, anchor_statement)\n',
          )
          s = s.replace(
              '        without_utility = _verification_utility(without, receipt.verified_status)\n',
              '        without_utility = _verification_utility(without, receipt.verified_status, anchor_statement)\n',
          )
          p.write_text(s)

          # F037: historical ORDER-003 fixtures use the explicit compatibility lane.
          p = Path('src/mimicus/validation/order003_worker.py')
          s = p.read_text()
          count = s.count('fixture=')
          assert count >= 6, count
          s = s.replace('fixture=', 'source_mode="fixture", fixture=')
          p.write_text(s)

          # ORDER-006 regression: verified receipts now use a server-side policy + bound proof.
          p = Path('tests/integration/test_order006_runtime.py')
          s = p.read_text()
          old = '''    engine = MiMicusEngine(database)\n    # Parent tolerance is 5%; 4% error passes parent, while the safe deterministic\n'''
          new = '''    engine = MiMicusEngine(database)\n    verifier_token = "order006-numeric-registry-token-v1"\n    engine.register_verifier_authority(\n        verifier_id="oracle:numeric-registry",\n        authority_class="deterministic_oracle",\n        source_independence_cluster="numeric-registry-v1",\n        auth_token=verifier_token,\n    )\n    # Parent tolerance is 5%; 4% error passes parent, while the safe deterministic\n'''
          assert old in s
          s = s.replace(old, new, 1)
          needle = '        verifier_id="oracle:numeric-registry",\n        observed_at=observed,\n'
          assert needle in s
          s = s.replace(needle, '        verifier_id="oracle:numeric-registry",\n        auth_token=verifier_token,\n        observed_at=observed,\n', 1)

          old = '''    engine = MiMicusEngine(database, services=_services(database, 2))\n    failed_pair: set[str] | None = None\n    for episode in range(5):\n        result = engine.run(RunRequest(task="Assess an underdetermined question.", domain="general", max_agents=2))\n'''
          new = '''    engine = MiMicusEngine(database, services=_services(database, 2))\n    verifier_token = "order006-cofailure-authority-token-v1"\n    engine.register_verifier_authority(\n        verifier_id="verifier:order006-regression",\n        authority_class="trusted_human",\n        source_independence_cluster="order006-regression-authority",\n        auth_token=verifier_token,\n    )\n    failed_pair: set[str] | None = None\n    for episode in range(5):\n        result = engine.run(\n            RunRequest(\n                task="Assess an underdetermined question.",\n                domain="general",\n                max_agents=2,\n                evidence=_evidence({"context": f"verified-episode-{episode}"}),\n            )\n        )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                verifier_id=f"verifier:{episode}:{index}",\n                observed_at=datetime(2026, 8, 18, 12, episode, tzinfo=UTC),\n                source_independence_cluster=f"verified-episode-{episode}-{index}",\n'''
          new = '''                evidence_hashes=tuple(result.evidence_provenance["provider_input_evidence_hashes"]),\n                verifier_id="verifier:order006-regression",\n                auth_token=verifier_token,\n                observed_at=datetime(2026, 8, 18, 12, episode, tzinfo=UTC),\n                source_independence_cluster="order006-regression-authority",\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ORDER-006 executable evidence uses the same authenticated/bound semantics.
          p = Path('scripts/order006_evidence.py')
          s = p.read_text()
          old = '''    engine = MiMicusEngine(db)\n    run = engine.run(RunRequest(task="Assess the supplied bundle.", domain="finance", evidence=_evidence(_numeric(1248.0)), learn=True))\n'''
          new = '''    engine = MiMicusEngine(db)\n    verifier_token = "order006-evidence-oracle-token-v1"\n    engine.register_verifier_authority(\n        verifier_id="oracle:order006-numeric-registry",\n        authority_class="deterministic_oracle",\n        source_independence_cluster="order006-numeric-registry-v1",\n        auth_token=verifier_token,\n    )\n    run = engine.run(RunRequest(task="Assess the supplied bundle.", domain="finance", evidence=_evidence(_numeric(1248.0)), learn=True))\n'''
          assert old in s
          s = s.replace(old, new, 1)
          needle = '        verifier_id="oracle:order006-numeric-registry",\n        observed_at=observed,\n'
          assert needle in s
          s = s.replace(needle, '        verifier_id="oracle:order006-numeric-registry",\n        auth_token=verifier_token,\n        observed_at=observed,\n', 1)

          old = '''    engine = MiMicusEngine(db, services=_services(db, 2))\n    failed_pair: set[str] | None = None\n    run_ids: list[str] = []\n    for episode in range(5):\n        result = engine.run(RunRequest(task="Assess an underdetermined question.", domain="general", max_agents=2))\n'''
          new = '''    engine = MiMicusEngine(db, services=_services(db, 2))\n    verifier_token = "order006-evidence-cofailure-token-v1"\n    engine.register_verifier_authority(\n        verifier_id="order006:cofailure:authority",\n        authority_class="trusted_human",\n        source_independence_cluster="order006-cofailure-authority",\n        auth_token=verifier_token,\n    )\n    failed_pair: set[str] | None = None\n    run_ids: list[str] = []\n    for episode in range(5):\n        result = engine.run(\n            RunRequest(\n                task="Assess an underdetermined question.",\n                domain="general",\n                max_agents=2,\n                evidence=_evidence({"context": f"cofailure-{episode}"}),\n            )\n        )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                    verifier_id=f"order006:cofailure:{episode}:{index}",\n                    observed_at=datetime(2026, 8, 18, 12, episode, tzinfo=UTC),\n                    source_independence_cluster=f"order006-verified-episode-{episode}-{index}",\n'''
          new = '''                    evidence_hashes=tuple(result.evidence_provenance["provider_input_evidence_hashes"]),\n                    verifier_id="order006:cofailure:authority",\n                    auth_token=verifier_token,\n                    observed_at=datetime(2026, 8, 18, 12, episode, tzinfo=UTC),\n                    source_independence_cluster="order006-cofailure-authority",\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ORDER-006 MCP regression: authority is provisioned server-side before server launch.
          p = Path('scripts/order006_mcp_e2e.py')
          s = p.read_text()
          import_marker = 'from typing import Any\n\n\n'
          assert import_marker in s
          s = s.replace(import_marker, 'from typing import Any\n\nfrom mimicus.orchestration.engine import MiMicusEngine\n\n\n', 1)
          old = '''        database_url = f"sqlite:///{Path(directory) / 'mcp.db'}"\n        first_process, first_url = _start(database_url)\n'''
          new = '''        database_url = f"sqlite:///{Path(directory) / 'mcp.db'}"\n        verifier_token = "order006-mcp-registry-token-v1"\n        MiMicusEngine(database_url).register_verifier_authority(\n            verifier_id="oracle:order006-mcp-registry",\n            authority_class="deterministic_oracle",\n            source_independence_cluster="order006-mcp-registry-v1",\n            auth_token=verifier_token,\n        )\n        first_process, first_url = _start(database_url)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          needle = '                        "verifier_id": "oracle:order006-mcp-registry",\n                        "observed_at":'
          assert needle in s
          s = s.replace(needle, '                        "verifier_id": "oracle:order006-mcp-registry",\n                        "auth_token": verifier_token,\n                        "observed_at":', 1)
          p.write_text(s)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Format and static gate
        run: |
          ruff format src/mimicus/interfaces/cli.py src/mimicus/storage/swarm_state.py src/mimicus/verification/service.py src/mimicus/validation/order003_worker.py tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py scripts/order006_evidence.py scripts/order006_mcp_e2e.py
          ruff check src/mimicus/interfaces/cli.py src/mimicus/storage/swarm_state.py src/mimicus/verification/service.py src/mimicus/validation/order003_worker.py tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py scripts/order006_evidence.py scripts/order006_mcp_e2e.py
          mypy src/mimicus
      - name: Targeted authenticated regressions
        run: |
          pytest tests/unit/test_order007_correctness.py tests/integration/test_order006_runtime.py
          python -m mimicus.validation.order003_e2e "$RUNNER_TEMP/ORDER-003"
          python scripts/order006_evidence.py "$RUNNER_TEMP/ORDER-006"
          python scripts/order006_mcp_e2e.py "$RUNNER_TEMP/ORDER-006-MCP"
      - name: Commit compatibility fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mimicus tests scripts
          git diff --cached --check
          git commit -m 'ORDER-007: authenticate historical verification regressions'
          git push origin HEAD:order-002-mimicus-v01
