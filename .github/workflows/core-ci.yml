name: Mimicus CI

on:
  push:
    branches:
      - "main"
      - "release/mimicus-v0.3-prep"
      - "aud-arq/mimicus-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: mimicus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Commercial triage smoke
        env:
          MIMICUS_DATABASE_URL: "sqlite:///:memory:"
        run: |
          mimicus triage \
            --profile offline \
            --ledger-file fixtures/commercial-observer-demo.json \
            --policy-file config/commercial-policy-v1.json \
            --as-of "2026-10-04T00:00:00-03:00" > /tmp/mimicus-triage.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/mimicus-triage.json", encoding="utf-8"))
          assert payload["selected_by_lane"]["facebook"][0] == "demo-proposal"
          assert "demo-weak-prepared" in payload["held_ids"]
          PY
      - name: Commercial funnel smoke
        env:
          MIMICUS_DATABASE_URL: "sqlite:///:memory:"
        run: |
          mimicus funnel \
            --profile offline \
            --ledger-file fixtures/commercial-observer-demo.json \
            --policy-file config/commercial-policy-v1.json \
            --as-of "2026-10-04T00:00:00-03:00" > /tmp/mimicus-funnel.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/mimicus-funnel.json", encoding="utf-8"))
          assert payload["overall"]["lead_count"] == 4
          assert payload["overall"]["terminal_outcome_counts"] == {"lost": 1, "won": 1}
          assert payload["overall"]["terminal_win_rate"] == 0.5
          assert payload["overall"]["qualified_to_proposal"]["advanced_count"] == 3
          assert payload["overall"]["proposal_to_terminal"]["advanced_count"] == 2
          assert "Demo Buyer" not in json.dumps(payload)
          assert "demo:" not in json.dumps(payload)
          PY
      - name: Tests and coverage
        run: pytest --cov=mimicus --cov-report=term-missing
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/mimicus
      - name: Build
        run: python -m build

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: node --check public/app.js
      - name: Worker dry-run
        run: npx --yes wrangler@4.134.0 deploy --dry-run
