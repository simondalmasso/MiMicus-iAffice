name: Mimicus CI

on:
  push:
    branches:
      - "main"
      - "release/mimicus-v0.3-prep"
      - "aud-arq/mimicus-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: mimicus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests and coverage
        run: pytest --cov=mimicus --cov-report=term-missing
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/mimicus
      - name: Build
        run: python -m build

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: node --check public/app.js
      - name: Worker dry-run
        run: npx --yes wrangler@4.134.0 deploy --dry-run
