<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
<title>iAffice · Revenue Engine</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f3ef;--surface:#fff;--line:#dfddd7;--muted:#6d6a64;--soft:#eceae4;--good:#e4f3e7;--warn:#fff0c3;--bad:#f9dfdc}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:17px 22px;background:#141414;color:#fff;position:sticky;top:0;z-index:5}
header strong{font-size:19px;letter-spacing:-.03em}.sub{font-size:12px;opacity:.68}.status{margin-left:auto;font-size:11px;opacity:.75}
nav{display:flex;gap:6px;padding:10px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:54px;z-index:4;backdrop-filter:blur(12px)}
nav button{border:0;background:transparent;padding:8px 11px;border-radius:999px;color:#555;white-space:nowrap;cursor:pointer}nav button[aria-selected=true]{background:#171717;color:#fff}
main{max-width:1480px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:3px 0 18px}.hero h1{font-size:42px;line-height:.98;margin:0;letter-spacing:-.055em}.hero p{margin:8px 0 0;max-width:720px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px}.metric{font-size:30px;font-weight:760;letter-spacing:-.04em}.muted{font-size:12px;color:var(--muted)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:750}.list{display:grid;gap:8px}
.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--soft);font-size:10px;margin:2px 3px 2px 0}.ok{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.section{display:flex;justify-content:space-between;align-items:center;margin:25px 0 10px}.section h2{margin:0;font-size:20px;letter-spacing:-.025em}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid #eceae5;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:last-child td{border-bottom:0}.score{font-size:23px;font-weight:780}
.progress{height:6px;background:#eceae4;border-radius:999px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:#171717}.feed{display:grid;gap:8px}.feed-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stream{font-size:10px;letter-spacing:.08em;font-weight:800}.time{font-size:10px;color:var(--muted);white-space:nowrap}.owner{font-weight:700}
pre{white-space:pre-wrap;overflow:auto;font-size:11px;background:#f7f6f2;padding:9px;border-radius:9px;margin:7px 0 0}
input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}.case-link{border:0;background:transparent;padding:0;cursor:pointer;text-align:left}.case-link:hover{text-decoration:underline}.case-card{appearance:none;color:inherit}.case-card:hover{border-color:#a9a69f}button.action{background:#171717;color:#fff;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}button.reject{background:#fff;color:#171717;border:1px solid #aaa}
.trace-tree{display:grid;gap:7px}.trace-node{border-left:2px solid #c9c6be;padding:8px 10px;margin-left:calc(var(--depth,0)*14px);background:#fff;border-radius:0 10px 10px 0}.trace-node.error{border-left-color:#b42318}.trace-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.trace-op{font-weight:750}.trace-button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}.trace-button.active{border-color:#171717;background:#f0eee8}.agent{min-height:174px}.agent h3{margin:0 0 8px;font-size:15px}.agent p{margin:0 0 12px}.decision{border-left:3px solid #171717}.tiny{font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #c9c6be;border-radius:14px;background:rgba(255,255,255,.45)}.case-toolbar{display:flex;gap:8px;align-items:center;margin:0 0 14px}.view-toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.view-toggle.active{background:#171717;color:#fff}.case-board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow:auto;padding-bottom:8px}.case-col{min-width:230px}.case-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.case-stack{display:grid;gap:8px}.case-mini{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:inherit}.case-mini:hover{border-color:#a9a69f}.case-mini h4{margin:3px 0 7px}.case-mini .score{font-size:18px}
@media(max-width:1050px){.grid,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:flex-start}.hero h1{font-size:34px}}
@media(max-width:680px){main{padding:14px}.grid,.grid.three{grid-template-columns:1fr}.feed-item{grid-template-columns:1fr}.time{white-space:normal}.hero{display:block}.hero h1{font-size:31px}header .sub{display:none}table{display:block;overflow:auto}}
</style>
</head>
<body>
<header><strong>iAffice</strong><span class="sub">autonomous revenue operations · evidence first</span><span class="status" id="health">health · loading</span></header>
<nav id="tabs" aria-label="Operations sections"></nav>
<main id="app" aria-live="polite"></main>
<script>
const sections=['Revenue','Global Core','Operations','Discovery','Demos','Cases','Live','Decisions','Learning','Telemetry','Skills','Squad','Approvals','Compute','System'];
let current='Revenue',core={},sniper={pipeline:{},money:{},topOpportunities:[],activity:[],memory:{}},globalState={portfolio:{total:0,signals:[]},latest:null,architecture:{}},operationsState={stages:[],workstreams:{},totalCases:0},discoveryState={sources:{policy:{},totals:{},sources:[]},jobs:[]},demoState=[],executorState={policy:{},totals:{},executors:[]},telemetryState={summary:{},recentSpans:[],recentTraceIds:[],adapters:[]},skillsState={policy:{},totals:{},sources:[]},selectedTrace=null,selectedTraceId=null,caseIndex=[],squad=[],compute={providers:[],budget:{}},healthState={},adminToken='',selectedCase=null,selectedCaseId=null,casesViewMode='BOARD';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-AR');
const empty=t=>'<div class="empty">'+esc(t)+'</div>';
function nav(){tabs.innerHTML=sections.map(s=>'<button aria-selected="'+(s===current)+'" data-s="'+s+'">'+s+'</button>').join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.s;nav();render()})}
function badge(v){const c=v==='WON'||v==='COLLECTED'||v==='PASS'?'ok':v==='NEGOTIATING'||v==='PENDING'||v==='UNCERTAIN'?'warn':v==='LOST'||v==='FAIL'?'bad':'';return '<span class="badge '+c+'">'+esc(v)+'</span>'}
function revenue(){
 const p=sniper.pipeline||{},m=sniper.money||{},ops=sniper.topOpportunities||[];
 return '<div class="hero"><div><div class="eyebrow">Commercial operating system</div><h1>Find. Prove. Sell. Deliver.</h1><p>The system discovers opportunities, builds evidence, chooses the offer, prepares proof, negotiates, delivers and learns from audited outcomes.</p></div><div class="muted">auto-refresh · 8s</div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">Opportunities</div><div class="metric">'+fmt(p.total)+'</div><div class="muted">'+fmt(p.qualified)+' qualified</div></div>'+
 '<div class="card"><div class="eyebrow">Negotiating</div><div class="metric">'+fmt(p.negotiating)+'</div><div class="muted">human gate only when required</div></div>'+
 '<div class="card"><div class="eyebrow">Won</div><div class="metric">'+fmt(p.won)+'</div><div class="muted">'+fmt(p.lost)+' lost</div></div>'+
 '<div class="card"><div class="eyebrow">Collections</div><div class="metric">$ '+fmt(m.pendingArs)+'</div><div class="muted">$ '+fmt(m.collectedArs)+' collected</div></div>'+
 '</div>'+
 '<div class="section"><h2>Priority opportunities</h2><span class="muted">evidence → diagnosis → next owner</span></div>'+
 (ops.length?'<table><thead><tr><th>Business</th><th>Score</th><th>Status</th><th>Recommended offer</th><th>Next owner</th><th>Next action</th></tr></thead><tbody>'+
 ops.map(x=>'<tr><td><button class="case-link" data-case="'+esc(x.id)+'"><strong>'+esc(x.businessName)+'</strong></button><div class="muted">'+esc(x.category)+' · '+esc(x.locality)+'</div></td><td><div class="score">'+esc(x.score)+'</div><div class="progress"><span style="width:'+Math.max(0,Math.min(100,Number(x.score||0)))+'%"></span></div></td><td>'+badge(x.status)+'</td><td>'+esc((x.offer?.primary||[]).join(' + ')||'research')+'<div class="muted">'+esc((x.reasons||[]).slice(0,3).join(' · '))+'</div></td><td><span class="owner">'+esc(x.nextOwner)+'</span></td><td>'+esc(x.nextAction)+'</td></tr>').join('')+
 '</tbody></table>':empty('No opportunities recorded yet.'));
}

function globalCoreView(){
 const g=globalState||{},latest=g.latest||null,portfolio=g.portfolio||{total:0,signals:[]},arch=g.architecture||{};
 const active=latest?.active||[],deferred=latest?.deferred||[],human=latest?.humanAttention||[],ranked=latest?.ranked||[];
 const sys1=latest?.system1||{provider:'LAYA_COMPATIBLE',state:'NOT_CONNECTED'};
 return '<div class="hero"><div><div class="eyebrow">Company-level cognition</div><h1>Global Decision Core</h1><p>This layer sees the entire portfolio, allocates scarce attention, routes cases to specialists and escalates only when policy or uncertainty requires it.</p></div><div>'+badge(sys1.state||'NOT_CONNECTED')+'</div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">Portfolio</div><div class="metric">'+fmt(portfolio.total||0)+'</div><div class="muted">all known cases</div></div>'+
 '<div class="card"><div class="eyebrow">Active allocations</div><div class="metric">'+fmt(active.length)+'</div><div class="muted">cases currently receiving company attention</div></div>'+
 '<div class="card"><div class="eyebrow">Human attention</div><div class="metric">'+fmt(human.length)+'</div><div class="muted">HUMAN_GATE / exceptional review</div></div>'+
 '<div class="card"><div class="eyebrow">System 1</div><div class="metric" style="font-size:18px">'+esc(sys1.provider||'LAYA_COMPATIBLE')+'</div><div class="muted">'+esc(sys1.state||'NOT_CONNECTED')+'</div></div>'+
 '</div>'+
 '<div class="section"><h2>Architecture</h2><span class="muted">System 1 → System 2 → policy/AUD</span></div>'+
 '<div class="grid three"><div class="card"><div class="eyebrow">System 1</div><strong>'+esc(arch.system1||'typed calibrated decision service')+'</strong><p class="muted">Fast routing, scoring and abstention. Laya-compatible runtime candidate.</p></div><div class="card"><div class="eyebrow">System 2</div><strong>'+esc(arch.system2||'aria-models reasoning')+'</strong><p class="muted">Deliberation, specialist synthesis and complex reasoning.</p></div><div class="card"><div class="eyebrow">Authority</div><strong>'+esc(arch.authority||'deterministic policy + audited memory + human gate')+'</strong><p class="muted">No model can silently expand authority.</p></div></div>'+
 '<div class="section"><h2>Active allocations</h2><span class="muted">'+(latest?('decision '+esc(latest.decisionId)):'no plan yet')+'</span></div>'+
 (active.length?'<div class="grid three">'+active.map(x=>'<button class="card case-card" data-case="'+esc(x.caseId)+'" style="text-align:left;cursor:pointer"><div class="eyebrow">'+esc(x.ownerRole)+'</div><h3>'+esc(x.caseId)+'</h3><div class="score">'+Number(x.globalScore||0).toFixed(1)+'</div><div class="muted">'+esc(x.nextObjective)+'</div><div style="margin-top:8px">'+(x.reasons||[]).slice(0,4).map(r=>'<span class="badge">'+esc(r)+'</span>').join('')+'</div></button>').join('')+'</div>':empty('No active global allocation persisted yet.'))+
 '<div class="section"><h2>Portfolio ranking</h2><span class="muted">global score, not local case score</span></div>'+
 (ranked.length?'<table><thead><tr><th>Case</th><th>Global score</th><th>Status</th><th>Evidence</th><th>Route signals</th></tr></thead><tbody>'+ranked.map(x=>'<tr><td><button class="case-link" data-case="'+esc(x.caseId)+'">'+esc(x.caseId)+'</button></td><td><strong>'+Number(x.globalScore||0).toFixed(1)+'</strong></td><td>'+badge(x.status)+'</td><td>'+fmt(x.evidenceCount)+'</td><td>'+esc((x.reasons||[]).join(' · '))+'</td></tr>').join('')+'</tbody></table>':empty('The first business tick will persist a portfolio plan.'))+
 '<div class="section"><h2>Human attention</h2></div>'+
 (human.length?'<div class="list">'+human.map(x=>'<div class="row"><strong>'+esc(x.caseId)+'</strong> <span class="badge warn">HUMAN_GATE</span><div class="muted">'+esc((x.reasons||[]).join(' · '))+'</div></div>').join('')+'</div>':empty('No case currently requires human attention.'))+
 '<div class="section"><h2>Deferred</h2></div>'+
 (deferred.length?'<div class="list">'+deferred.slice(0,40).map(x=>'<div class="row"><strong>'+esc(x.caseId)+'</strong> <span class="badge">'+Number(x.globalScore||0).toFixed(1)+'</span><div class="muted">'+esc((x.reasons||[]).join(' · '))+'</div></div>').join('')+'</div>':empty('No deferred cases in latest plan.'));
}

function operationsView(){
 const o=operationsState||{},stages=o.stages||[],streams=o.workstreams||{};
 return '<div class="hero"><div><div class="eyebrow">Company workstreams</div><h1>Operations</h1><p>The company runs through five canonical stages. Each CASE appears in exactly one operational workstream according to its current state.</p></div><div class="muted">'+fmt(o.totalCases)+' cases</div></div>'+
 '<div class="case-board">'+stages.map(stage=>{const items=streams[stage.id]||[];return '<section class="case-col"><div class="case-col-head"><div><strong>'+esc(stage.label)+'</strong><div class="muted">'+esc(stage.purpose)+'</div></div><span class="badge">'+items.length+'</span></div><div class="case-stack">'+(items.length?items.map(x=>'<button class="case-mini" data-case="'+esc(x.caseId)+'"><div class="eyebrow">'+esc(x.owner)+'</div><h4>'+esc(x.businessName)+'</h4><div class="score">'+esc(x.score)+'</div><div>'+badge(x.status)+'</div><div class="muted">'+esc(x.nextAction)+'</div></button>').join(''):empty('No cases'))+'</div><div style="margin-top:8px">'+(stage.externalEffectBoundary||[]).map(x=>'<span class="badge warn">'+esc(x)+'</span>').join('')+'</div></section>'}).join('')+'</div>';
}


function discoveryView(){
 const ds=discoveryState||{},src=ds.sources||{},jobs=ds.jobs||[],tot=src.totals||{},sources=src.sources||[];
 return '<div class="hero"><div><div class="eyebrow">Market intelligence intake</div><h1>Discovery</h1><p>Discovery jobs scan configured public-business sources, deduplicate evidence, audit digital gaps and create CASE dossiers. No source runs until cost, terms, automation scope and health are verified.</p></div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">Sources enabled</div><div class="metric">'+fmt(tot.enabled)+'</div><div class="muted">'+fmt(tot.quarantined)+' quarantined · '+fmt(tot.rejected)+' rejected</div></div>'+
 '<div class="card"><div class="eyebrow">Jobs</div><div class="metric">'+fmt(jobs.length)+'</div><div class="muted">'+fmt(jobs.filter(x=>x.state==="RUNNING").length)+' running</div></div>'+
 '<div class="card"><div class="eyebrow">Cases created</div><div class="metric">'+fmt(jobs.reduce((n,x)=>n+Number(x.caseCount||0),0))+'</div><div class="muted">from governed discovery</div></div>'+
 '<div class="card"><div class="eyebrow">Private enrichment</div><div class="metric">OFF</div><div class="muted">public business contacts only</div></div>'+
 '</div>'+
 '<div class="section"><h2>Discovery jobs</h2><span class="muted">locality + categories + admitted sources</span></div>'+
 (jobs.length?'<table><thead><tr><th>Job</th><th>Area</th><th>Categories</th><th>State</th><th>Found</th><th>Deduped</th><th>Cases</th><th>Sources</th><th>Reason</th></tr></thead><tbody>'+jobs.map(x=>'<tr><td><strong>'+esc(x.jobId)+'</strong></td><td>'+esc(x.locality)+'</td><td>'+esc((x.categories||[]).join(' · '))+'</td><td>'+badge(x.state)+'</td><td>'+fmt(x.foundCount)+'</td><td>'+fmt(x.dedupedCount)+'</td><td>'+fmt(x.caseCount)+'</td><td>'+esc((x.sourceIds||[]).join(' · '))+'</td><td class="muted">'+esc((x.decisionReasons||[]).join(' · ')||x.errorCode||'—')+'</td></tr>').join('')+'</tbody></table>':empty('No discovery jobs yet. Sources must be admitted before a job can run.'))+
 '<div class="section"><h2>Source registry</h2><span class="muted">crawler license ≠ permission to automate a target</span></div>'+
 (sources.length?'<table><thead><tr><th>Source</th><th>Admission</th><th>License</th><th>Runtime</th><th>Pin</th><th>$0</th><th>Terms</th><th>Automation</th><th>Health</th><th>Reasons</th></tr></thead><tbody>'+sources.map(x=>'<tr><td><strong>'+esc(x.label)+'</strong><div class="muted">'+esc(x.source)+'</div></td><td>'+badge(x.admission?.state)+'</td><td>'+esc(x.license)+'</td><td>'+esc(x.runtimeCost)+'</td><td class="tiny">'+esc(x.revisionPin||'UNPINNED')+'</td><td>'+esc(x.zeroCostVerified)+'</td><td>'+esc(x.targetTermsVerified)+'</td><td>'+esc(x.automationAllowed)+'</td><td>'+esc(x.health)+'</td><td class="muted">'+esc((x.admission?.reasons||[]).join(' · '))+'</td></tr>').join('')+'</tbody></table>':empty('No discovery sources registered.'));
}

function casesView(){
 const ops=caseIndex||[];
 if(selectedCase){
  const c=selectedCase,b=c.business||{},st=c.state||{},ev=c.evaluation||{},e=c.evidence||{},r=c.recommendation||{},com=c.commercial||{},ctrl=com.controls||{},cog=c.cognition||{},mem=c.memory||{};
  return '<div class="hero"><div><button class="action reject" id="backCases">← Cases</button><div class="eyebrow" style="margin-top:12px">Case · '+esc(c.caseId)+'</div><h1>'+esc(b.name)+'</h1><p>'+esc(b.category)+' · '+esc(b.locality)+' · owner '+esc(st.nextOwner)+'</p></div>'+badge(st.status)+'</div>'+
  '<div class="grid"><div class="card"><div class="eyebrow">Opportunity score</div><div class="metric">'+fmt(ev.score)+'</div><div class="muted">'+esc((ev.reasons||[]).join(' · '))+'</div></div><div class="card"><div class="eyebrow">Next action</div><div class="metric" style="font-size:18px">'+esc(st.nextAction)+'</div><div class="muted">'+esc(st.nextOwner)+'</div></div><div class="card"><div class="eyebrow">Primary offer</div><div>'+esc((r.primary||[]).join(' + ')||'—')+'</div><div class="muted">'+esc((r.why||[]).join(' · '))+'</div></div><div class="card"><div class="eyebrow">Evidence refs</div><div class="metric">'+fmt((e.refs||[]).length)+'</div><div class="muted">'+esc((e.refs||[]).join(' · '))+'</div></div></div>'+
  '<div class="section"><h2>Evaluation</h2><span class="muted">observed facts ≠ inferred recommendation</span></div><div class="grid three"><div class="card"><h3>Observed facts</h3>'+(e.observedFacts||[]).map(x=>'<div class="row" style="margin-top:6px">'+esc(x)+'</div>').join('')+'</div><div class="card"><h3>Recommendation</h3><div><strong>'+esc((r.primary||[]).join(' + ')||'—')+'</strong></div><p>'+esc(r.demoBrief||'')+'</p><span class="badge warn">inference</span></div><div class="card"><h3>Contacts</h3><pre>'+esc(JSON.stringify(b.contacts||[],null,2))+'</pre></div></div>'+
  '<div class="section"><h2>Commercial safety</h2><span class="muted">revalidated again inside aria-effects</span></div><div class="grid three"><div class="card"><div class="eyebrow">Contact policy</div>'+(ctrl.doNotContact?'<span class="badge bad">DO NOT CONTACT</span>':'<span class="badge ok">CONTACT ELIGIBLE</span>')+(ctrl.explicitRefusal?'<span class="badge bad">EXPLICIT REFUSAL</span>':'')+'<p class="muted">'+esc(ctrl.reason||'No refusal/opt-out recorded.')+'</p></div><div class="card"><div class="eyebrow">Executed commercial effects</div><div class="metric">'+fmt((ctrl.effects||[]).length)+'</div><div class="muted">durable / idempotent effect history</div></div><div class="card"><div class="eyebrow">Control evidence</div><div class="metric">'+fmt((ctrl.evidenceRefs||[]).length)+'</div><div class="muted">'+esc((ctrl.evidenceRefs||[]).join(' · '))+'</div></div></div>'+
  ((ctrl.effects||[]).length?'<table><thead><tr><th>When</th><th>Operation</th><th>Target</th><th>State</th></tr></thead><tbody>'+(ctrl.effects||[]).slice(0,20).map(x=>'<tr><td class="tiny">'+esc(x.createdAt)+'</td><td>'+esc(x.operation)+'</td><td>'+esc(x.target)+'</td><td>'+badge(x.state)+'</td></tr>').join('')+'</tbody></table>':'')+

  '<div class="section"><h2>Decisions</h2></div>'+(cog.decisions?.length?'<div class="list">'+cog.decisions.map(x=>'<div class="row decision"><strong>'+esc(x.selectedMove)+'</strong> <span class="badge">'+Number(x.selectedScore||0).toFixed(3)+'</span><div class="muted">'+esc((x.reasons||[]).join(' · '))+'</div><pre>'+esc(JSON.stringify(x.alternatives||[],null,2))+'</pre></div>').join('')+'</div>':empty('No cognitive decisions yet.'))+

 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!adminToken)return;b.disabled=true;try{const r=await fetch('/api/approvals/'+encodeURIComponent(b.dataset.id)+'/'+b.dataset.op,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+adminToken},body:JSON.stringify({actor:'cockpit-human'})});if(!r.ok)throw new Error((await r.json()).error||('HTTP '+r.status));await load()}finally{b.disabled=false}})
}

async function safe(url,fallback){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():fallback}catch{return fallback}}

async function load(){
 const [h,c,d,g,o,ds,dj,dm,ex,t,sk,ci,sq,p,b]=await Promise.all([
  safe('/api/health',{ok:false}),
  safe('/api/state',{}),
  safe('/api/sniper/dashboard',{pipeline:{},money:{},topOpportunities:[],activity:[],memory:{}}),
  safe('/api/sniper/global',{portfolio:{total:0,signals:[]},latest:null,architecture:{}}),
  safe('/api/sniper/operations',{stages:[],workstreams:{},totalCases:0}),
  safe('/api/sniper/discovery/sources',{policy:{},totals:{},sources:[]}),
  safe('/api/sniper/discovery/jobs?limit=100',[]),
  safe('/api/sniper/demos?limit=100',[]),
  safe('/api/sniper/executors',{policy:{},totals:{},executors:[]}),
  safe('/api/sniper/telemetry',{summary:{},recentSpans:[],recentTraceIds:[],adapters:[]}),
  safe('/api/sniper/skills',{policy:{},totals:{},sources:[]}),
  safe('/api/sniper/opportunities?limit=500',[]),
  safe('/api/sniper/squad',[]),
  safe('/api/compute/providers',[]),
  safe('/api/compute/budget',{})
 ]);
 healthState=h;core=c;sniper=d;globalState=g;operationsState=o;discoveryState={sources:ds,jobs:dj};demoState=dm;executorState=ex;telemetryState=t;skillsState=sk;caseIndex=ci;squad=sq;compute={providers:p,budget:b};
 health.textContent='health · '+(h.ok?'PASS':'DEGRADED');
 if(selectedCaseId)selectedCase=await safe('/api/sniper/cases/'+encodeURIComponent(selectedCaseId),selectedCase);
 if(selectedTraceId)selectedTrace=await safe('/api/sniper/telemetry/traces/'+encodeURIComponent(selectedTraceId),selectedTrace);
 render();
}
nav();render();load();setInterval(load,8000);
</script>
