<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'">
<title>Revenue Engine</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f3ef;--surface:#fff;--line:#dfddd7;--muted:#6d6a64;--soft:#eceae4;--good:#e4f3e7;--warn:#fff0c3;--bad:#f9dfdc}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:17px 22px;background:#141414;color:#fff;position:sticky;top:0;z-index:5}
header strong{font-size:19px;letter-spacing:-.03em}.sub{font-size:12px;opacity:.68}.status{margin-left:auto;font-size:11px;opacity:.75}
nav{display:flex;gap:6px;padding:10px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:54px;z-index:4;backdrop-filter:blur(12px)}
nav button{border:0;background:transparent;padding:8px 11px;border-radius:999px;color:#555;white-space:nowrap;cursor:pointer}nav button[aria-selected=true]{background:#171717;color:#fff}
main{max-width:1480px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:3px 0 18px}.hero h1{font-size:42px;line-height:.98;margin:0;letter-spacing:-.055em}.hero p{margin:8px 0 0;max-width:720px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px}.metric{font-size:30px;font-weight:760;letter-spacing:-.04em}.muted{font-size:12px;color:var(--muted)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:750}.list{display:grid;gap:8px}
.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--soft);font-size:10px;margin:2px 3px 2px 0}.ok{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.section{display:flex;justify-content:space-between;align-items:center;margin:25px 0 10px}.section h2{margin:0;font-size:20px;letter-spacing:-.025em}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid #eceae5;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:last-child td{border-bottom:0}.score{font-size:23px;font-weight:780}
.progress{height:6px;background:#eceae4;border-radius:999px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:#171717}.feed{display:grid;gap:8px}.feed-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stream{font-size:10px;letter-spacing:.08em;font-weight:800}.time{font-size:10px;color:var(--muted);white-space:nowrap}.owner{font-weight:700}
pre{white-space:pre-wrap;overflow:auto;font-size:11px;background:#f7f6f2;padding:9px;border-radius:9px;margin:7px 0 0}
input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff}button.action{background:#171717;color:#fff;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}button.reject{background:#fff;color:#171717;border:1px solid #aaa}
.agent{min-height:174px}.agent h3{margin:0 0 8px;font-size:15px}.agent p{margin:0 0 12px}.decision{border-left:3px solid #171717}.tiny{font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #c9c6be;border-radius:14px;background:rgba(255,255,255,.45)}
@media(max-width:1050px){.grid,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:flex-start}.hero h1{font-size:34px}}
@media(max-width:680px){main{padding:14px}.grid,.grid.three{grid-template-columns:1fr}.feed-item{grid-template-columns:1fr}.time{white-space:normal}.hero{display:block}.hero h1{font-size:31px}header .sub{display:none}table{display:block;overflow:auto}}
</style>
</head>
<body>
<header><strong>Revenue Engine</strong><span class="sub">autonomous commercial operations · evidence first</span><span class="status" id="health">health · loading</span></header>
<nav id="tabs" aria-label="Operations sections"></nav>
<main id="app" aria-live="polite"></main>
<script>
const sections=['Revenue','Live','Decisions','Learning','Squad','Approvals','Compute','System'];
let current='Revenue',core={},sniper={pipeline:{},money:{},topOpportunities:[],activity:[],memory:{}},squad=[],compute={providers:[],budget:{}},healthState={},adminToken='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-AR');
const empty=t=>'<div class="empty">'+esc(t)+'</div>';
function nav(){tabs.innerHTML=sections.map(s=>'<button aria-selected="'+(s===current)+'" data-s="'+s+'">'+s+'</button>').join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.s;nav();render()})}
function badge(v){const c=v==='WON'||v==='COLLECTED'||v==='PASS'?'ok':v==='NEGOTIATING'||v==='PENDING'||v==='UNCERTAIN'?'warn':v==='LOST'||v==='FAIL'?'bad':'';return '<span class="badge '+c+'">'+esc(v)+'</span>'}
function revenue(){
 const p=sniper.pipeline||{},m=sniper.money||{},ops=sniper.topOpportunities||[];
 return '<div class="hero"><div><div class="eyebrow">Commercial operating system</div><h1>Find. Prove. Sell. Deliver.</h1><p>The system discovers opportunities, builds evidence, chooses the offer, prepares proof, negotiates, delivers and learns from audited outcomes.</p></div><div class="muted">auto-refresh · 8s</div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">Opportunities</div><div class="metric">'+fmt(p.total)+'</div><div class="muted">'+fmt(p.qualified)+' qualified</div></div>'+
 '<div class="card"><div class="eyebrow">Negotiating</div><div class="metric">'+fmt(p.negotiating)+'</div><div class="muted">human gate only when required</div></div>'+
 '<div class="card"><div class="eyebrow">Won</div><div class="metric">'+fmt(p.won)+'</div><div class="muted">'+fmt(p.lost)+' lost</div></div>'+
 '<div class="card"><div class="eyebrow">Collections</div><div class="metric">$ '+fmt(m.pendingArs)+'</div><div class="muted">$ '+fmt(m.collectedArs)+' collected</div></div>'+
 '</div>'+
 '<div class="section"><h2>Priority opportunities</h2><span class="muted">evidence → diagnosis → next owner</span></div>'+
 (ops.length?'<table><thead><tr><th>Business</th><th>Score</th><th>Status</th><th>Recommended offer</th><th>Next owner</th><th>Next action</th></tr></thead><tbody>'+
 ops.map(x=>'<tr><td><strong>'+esc(x.businessName)+'</strong><div class="muted">'+esc(x.category)+' · '+esc(x.locality)+'</div></td><td><div class="score">'+esc(x.score)+'</div><div class="progress"><span style="width:'+Math.max(0,Math.min(100,Number(x.score||0)))+'%"></span></div></td><td>'+badge(x.status)+'</td><td>'+esc((x.offer?.primary||[]).join(' + ')||'research')+'<div class="muted">'+esc((x.reasons||[]).slice(0,3).join(' · '))+'</div></td><td><span class="owner">'+esc(x.nextOwner)+'</span></td><td>'+esc(x.nextAction)+'</td></tr>').join('')+
 '</tbody></table>':empty('No opportunities recorded yet.'));
}
function live(){
 const a=sniper.activity||[];
 return '<div class="hero"><div><div class="eyebrow">Operational feed</div><h1>Live work</h1><p>Every important negotiation, decision, delivery, payment and learning event is written to durable state.</p></div></div>'+
 (a.length?'<div class="feed">'+a.map(x=>'<div class="feed-item"><div><div class="stream">'+esc(x.stream)+'</div><div class="muted">'+esc(x.actor)+'</div></div><div><strong>'+esc(x.eventType)+'</strong><pre>'+esc(JSON.stringify(x.detail||{},null,2))+'</pre></div><div class="time">'+esc(x.createdAt)+'</div></div>').join('')+'</div>':empty('No Sniper activity yet.'));
}
function decisions(){
 const ds=sniper.memory?.decisions||[];
 return '<div class="hero"><div><div class="eyebrow">Criterion and traceability</div><h1>Decisions</h1><p>The orchestrator ranks alternatives using context, learned tactic performance, fatigue, timing and policy gates. Every selected move remains inspectable.</p></div></div>'+
 (ds.length?'<div class="list">'+ds.map(x=>'<div class="row decision"><div class="eyebrow">'+esc(x.selected_tactic_id)+'</div><strong>'+esc(x.selected_move)+'</strong> <span class="badge">'+Number(x.selected_score||0).toFixed(3)+'</span><div class="muted">'+esc((x.reasons||[]).join(' · '))+'</div><div class="tiny muted">'+esc(x.created_at)+'</div></div>').join('')+'</div>':empty('No cognitive decision has been persisted yet.'));
}
function learning(){
 const mem=sniper.memory||{},tactics=mem.tactics||[],episodes=mem.episodes||[];
 return '<div class="hero"><div><div class="eyebrow">Memory architecture</div><h1>Learning</h1><p>Working memory holds the current dossier. Episodic memory records what happened. Semantic memory stores audited reusable patterns. Procedural memory tracks which tactics and skills actually work.</p></div></div>'+
 '<div class="grid">'+
 '<div class="card"><div class="eyebrow">Working</div><div class="metric">'+fmt((sniper.topOpportunities||[]).length)+'</div><div class="muted">active dossier context</div></div>'+
 '<div class="card"><div class="eyebrow">Episodes</div><div class="metric">'+fmt(episodes.length)+'</div><div class="muted">observed interactions/outcomes</div></div>'+
 '<div class="card"><div class="eyebrow">Tactics</div><div class="metric">'+fmt(tactics.length)+'</div><div class="muted">audited performance priors</div></div>'+
 '<div class="card"><div class="eyebrow">Promotion rule</div><div class="metric">AUD</div><div class="muted">no unaudited self-learning</div></div>'+
 '</div><div class="section"><h2>Tactic performance</h2></div>'+
 (tactics.length?'<table><thead><tr><th>Tactic</th><th>Score</th><th>Attempts</th><th>Replies</th><th>Meetings</th><th>Wins</th><th>Losses</th></tr></thead><tbody>'+tactics.map(x=>'<tr><td><strong>'+esc(x.tactic_id)+'</strong></td><td>'+Number(x.score||0).toFixed(3)+'</td><td>'+fmt(x.attempts)+'</td><td>'+fmt(x.replies)+'</td><td>'+fmt(x.meetings)+'</td><td>'+fmt(x.wins)+'</td><td>'+fmt(x.losses)+'</td></tr>').join('')+'</tbody></table>':empty('No audited tactic outcomes yet.'))+
 '<div class="section"><h2>Recent episodes</h2></div>'+
 (episodes.length?'<div class="list">'+episodes.slice(0,30).map(x=>'<div class="row"><strong>'+esc(x.agent_role)+' · '+esc(x.tactic_id)+'</strong> '+badge(x.outcome)+'<div>'+esc(x.observation)+'</div><div class="muted">audited='+esc(Boolean(x.audited))+' · '+esc(x.created_at)+'</div></div>').join('')+'</div>':empty('No episodes recorded yet.'));
}
function squadView(){
 return '<div class="hero"><div><div class="eyebrow">Outcome-owned specialists</div><h1>Squad</h1><p>Skills are tools; recurring ownership becomes an agent. Each specialist has one outcome and explicit fences.</p></div></div>'+
 '<div class="grid three">'+(squad||[]).map(x=>'<div class="card agent"><div class="eyebrow">specialist</div><h3>'+esc(x.role)+'</h3><p>'+esc(x.owns)+'</p><div class="muted"><strong>DONE</strong> · '+esc(x.definitionOfDone)+'</div><div style="margin-top:10px">'+(x.fences||[]).map(f=>'<span class="badge warn">'+esc(f)+'</span>').join('')+'</div></div>').join('')+'</div>';
}
function approvals(){
 const a=core.approvals||[];
 return '<div class="hero"><div><div class="eyebrow">Human gate</div><h1>Approvals</h1><p>Protected external effects still pass through the existing policy/effect kernel. Large meetings, non-standard terms and legal commitments route to a human.</p></div></div>'+
 '<div class="card"><label><strong>Admin bearer token</strong></label><input id="adminToken" type="password" autocomplete="off" placeholder="held only in page memory"><div class="muted">Never persisted in localStorage.</div></div><div class="section"><h2>Queue</h2></div>'+
 (a.length?'<div class="list">'+a.map(x=>'<div class="row"><strong>'+esc(x.actionClass)+'</strong> '+badge(x.state)+'<p>'+esc(x.reason)+'</p>'+(x.state==='PENDING'?'<button class="action" data-id="'+esc(x.id)+'" data-op="approve">Approve</button> <button class="action reject" data-id="'+esc(x.id)+'" data-op="reject">Reject</button>':'')+'</div>').join('')+'</div>':empty('No protected action waiting.'));
}
function computeView(){
 const p=compute.providers||[],b=compute.budget||{};
 return '<div class="hero"><div><div class="eyebrow">Zero-cost compute market</div><h1>Compute</h1><p>Cloudflare and independently verified free routes remain behind the model gateway. Unknown or billable routes stay denied.</p></div></div>'+
 '<div class="grid"><div class="card"><div class="eyebrow">Providers</div><div class="metric">'+fmt(p.length)+'</div></div><div class="card"><div class="eyebrow">Spend</div><div class="metric">$0</div></div><div class="card"><div class="eyebrow">Reserved free capacity</div><div class="metric">'+fmt(b.currentReserved)+'</div></div><div class="card"><div class="eyebrow">Billable attempts</div><div class="metric">'+fmt(b.billableExecutionAttempts)+'</div></div></div>'+
 '<div class="section"><h2>Provider registry</h2></div>'+
 (p.length?'<table><thead><tr><th>Provider</th><th>Free type</th><th>Billing</th><th>Privacy</th><th>Route</th></tr></thead><tbody>'+p.map(x=>'<tr><td>'+esc(x.providerName)+'</td><td>'+esc(x.freeType)+'</td><td>'+esc(x.billingSafety)+'</td><td>'+esc(x.privacyClass)+'</td><td>'+badge(x.routeState)+'</td></tr>').join('')+'</tbody></table>':empty('No provider registry available.'));
}
function system(){
 return '<div class="hero"><div><div class="eyebrow">Cloud runtime</div><h1>System</h1><p>Cloud-only architecture. The browser is an operator surface; durable state and agents live in the cloud.</p></div></div>'+
 '<div class="grid"><div class="card"><div class="eyebrow">Canonical state</div><div class="metric">D1</div></div><div class="card"><div class="eyebrow">Business effects</div><div class="metric" style="font-size:20px">aria-effects</div></div><div class="card"><div class="eyebrow">Model execution</div><div class="metric" style="font-size:20px">aria-models</div></div><div class="card"><div class="eyebrow">Deploy SHA</div><div class="muted">'+esc(healthState.sha||'unknown')+'</div></div></div>';
}
function render(){const views={Revenue:revenue(),Live:live(),Decisions:decisions(),Learning:learning(),Squad:squadView(),Approvals:approvals(),Compute:computeView(),System:system()};app.innerHTML=views[current]||views.Revenue;if(current==='Approvals')bindApprovals()}
function bindApprovals(){const input=document.getElementById('adminToken');if(input){input.value=adminToken;input.oninput=()=>adminToken=input.value}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!adminToken)return;b.disabled=true;try{const r=await fetch('/api/approvals/'+encodeURIComponent(b.dataset.id)+'/'+b.dataset.op,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+adminToken},body:JSON.stringify({actor:'cockpit-human'})});if(!r.ok)throw new Error((await r.json()).error||('HTTP '+r.status));await load()}finally{b.disabled=false}})}
async function safe(url,fallback){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():fallback}catch{return fallback}}
async function load(){const [h,c,d,sq,p,b]=await Promise.all([safe('/api/health',{ok:false}),safe('/api/state',{}),safe('/api/sniper/dashboard',{pipeline:{},money:{},topOpportunities:[],activity:[],memory:{}}),safe('/api/sniper/squad',[]),safe('/api/compute/providers',[]),safe('/api/compute/budget',{})]);healthState=h;core=c;sniper=d;squad=sq;compute={providers:p,budget:b};health.textContent='health · '+(h.ok?'PASS':'DEGRADED');render()}
nav();render();load();setInterval(load,8000);
</script>
</body>
</html>
