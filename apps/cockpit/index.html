<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" />
<title>AriaOS Cockpit</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#171717;background:#f6f6f4}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:20px;align-items:center;padding:18px 24px;background:#111;color:#fff;position:sticky;top:0}header strong{font-size:20px}.status{margin-left:auto;font-size:12px;opacity:.8}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid #ddd}nav button{border:0;background:#eee;padding:9px 12px;border-radius:999px;cursor:pointer}nav button[aria-selected=true]{background:#111;color:white}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;min-height:120px}.card h2,.card h3{margin-top:0}.metric{font-size:28px;font-weight:700}.muted{color:#666;font-size:13px}.list{display:grid;gap:8px}.row{padding:10px;border:1px solid #e5e5e5;border-radius:10px;background:#fff}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#eee}.danger{background:#fee}.ok{background:#efe}.hidden{display:none!important}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}button.action{background:#111;color:white;border:0;padding:8px 10px;border-radius:8px}button.reject{background:#fff;color:#111;border:1px solid #aaa}@media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:14px}nav{padding:10px;overflow:auto;flex-wrap:nowrap}main{padding:14px}table{font-size:12px;display:block;overflow:auto}}
</style>
</head>
<body>
<header><strong>AriaOS</strong><span>Autonomous Business Operating System</span><span class="status" id="health">health: loading</span></header>
<nav id="tabs" aria-label="Cockpit sections"></nav>
<main id="app" aria-live="polite"></main>
<script>
const sections=['Today','Tasks','Memory','Decisions','Approvals','Agents','System'];let current='Today';let state={};let budget={};let adminToken='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){tabs.innerHTML=sections.map(s=>`<button aria-selected="${s===current}" data-s="${s}">${s}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.s;nav();render()})}
const row=(k,v)=>`<div class="row"><strong>${esc(k)}</strong><div class="muted">${esc(v)}</div></div>`;
function render(){const s=state||{};const pending=(s.approvals||[]).filter(x=>x.state==='PENDING');const cards={
Today:`<div class="grid"><div class="card"><h2>CEO priority</h2><div class="metric">${esc((s.decisions||[]).at(-1)?.priority||'No priority yet')}</div></div><div class="card"><h3>Due tasks</h3><div class="metric">${(s.tasks||[]).filter(x=>x.status==='QUEUED').length}</div></div><div class="card"><h3>Pending approvals</h3><div class="metric">${pending.length}</div></div><div class="card"><h3>Agents</h3><div>${['CEO','RESEARCH','CMO','SALES','DATA','DEV','AUD'].map(x=>`<span class="badge">${x}</span> `).join('')}</div></div><div class="card"><h3>Anomalies / incidents</h3><div class="metric">${(s.auditFindings||[]).filter(x=>x.verdict!=='PASS').length}</div></div><div class="card"><h3>AI neurons</h3><div class="metric">${Number(budget.ai_neurons?.used||0).toFixed(1)}</div><div class="muted">hard cap ${budget.ai_neurons?.hard||8500}</div></div></div>`,
Tasks:`<h2>Tasks</h2><div class="list">${(s.tasks||[]).map(x=>row(`${x.type} · ${x.status}`,`owner=${x.requestedBy} priority=${x.priority}`)).join('')||row('No tasks','Queue is empty')}</div>`,
Memory:`<h2>Memory</h2><table><thead><tr><th>Status</th><th>Statement</th><th>Confidence</th><th>Source</th></tr></thead><tbody>${(s.knowledge||[]).map(x=>`<tr><td>${esc(x.status)}</td><td>${esc(x.statement)}</td><td>${esc(x.confidence)}</td><td>${esc((x.sourceRefs||[]).join(', '))}</td></tr>`).join('')}</tbody></table><h3>Claims</h3><div class="list">${(s.claims||[]).map(x=>row(`${x.status} · ${x.agentOrigin}`,x.statement)).join('')}</div>`,
Decisions:`<h2>Decisions</h2><div class="list">${(s.decisions||[]).map(x=>row(x.priority,`${x.rationale} · AUD=${x.auditVerdict}`)).join('')}</div>`,
Approvals:`<h2>Approvals</h2><div class="card"><label for="adminToken"><strong>Admin bearer token</strong></label><input id="adminToken" type="password" autocomplete="off" placeholder="held only in page memory" style="width:100%;padding:9px;margin-top:8px"><div class="muted">Not persisted in localStorage.</div></div><div class="list">${(s.approvals||[]).map(x=>{const action=(s.actions||[]).find(a=>a.approvalId===x.id);return `<div class="row"><strong>${esc(x.actionClass)} · ${esc(x.state)}</strong><p>${esc(x.reason)}</p><div class="muted">requester=${esc(x.requestedBy)} expiry=${esc(x.expiresAt)} consumed=${esc(x.consumedAt||'no')}</div><pre style="white-space:pre-wrap;overflow:auto">${esc(JSON.stringify(action?.payload||{actionHash:x.actionHash},null,2))}</pre>${x.state==='PENDING'?`<button class="action" data-approval="${esc(x.id)}" data-op="approve">Approve</button> <button class="action reject" data-approval="${esc(x.id)}" data-op="reject">Reject</button>`:''}</div>`}).join('')||row('No approvals','No protected external action waiting')}</div>`,
Agents:`<h2>Agents</h2><div class="grid">${['CEO','RESEARCH','CMO','SALES','DATA','DEV','AUD'].map(role=>`<div class="card"><h3>${role}</h3><div class="metric">${(s.modelCalls||[]).filter(c=>c.role===role).length}</div><div class="muted">model calls</div><div>${(s.auditFindings||[]).filter(a=>role==='AUD').length||0} audit findings</div></div>`).join('')}</div>`,
System:`<h2>System</h2><div class="grid"><div class="card"><h3>Health</h3><div class="metric" id="sysHealth">PASS</div></div><div class="card"><h3>Canonical memory</h3><div class="metric">D1</div></div><div class="card"><h3>Ledger</h3><div>tamper-evident SHA-256 chain</div></div><div class="card"><h3>Queue / workflow</h3><div>event-driven + retry-safe</div></div><div class="card"><h3>Cost</h3><div class="metric">$0</div><div class="muted">paid fallback denied</div></div><div class="card"><h3>Deploy SHA</h3><div class="muted" id="sha">loading</div></div></div>`};app.innerHTML=cards[current];if(current==='Approvals')bindApprovalActions()}
function bindApprovalActions(){const input=document.getElementById('adminToken');if(input){input.value=adminToken;input.oninput=()=>{adminToken=input.value}}document.querySelectorAll('[data-approval]').forEach(button=>{button.onclick=async()=>{if(!adminToken){health.textContent='health: admin token required';return}button.disabled=true;try{const response=await fetch(`/api/approvals/${encodeURIComponent(button.dataset.approval)}/${button.dataset.op}`,{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${adminToken}`},body:JSON.stringify({actor:'cockpit-human'})});if(!response.ok)throw new Error((await response.json()).error||`HTTP ${response.status}`);await load()}catch(error){health.textContent=`health: ${error.message}`}finally{button.disabled=false}}})}
async function load(){try{const [h,s,b]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/state').then(r=>r.json()),fetch('/api/system/budget').then(r=>r.json())]);health.textContent=`health: ${h.ok?'PASS':'FAIL'}`;state=s;budget=b;render();if(document.getElementById('sha'))document.getElementById('sha').textContent=h.sha||'unknown'}catch(e){health.textContent='health: unavailable';render()}}
nav();render();load();
</script>
</body></html>
