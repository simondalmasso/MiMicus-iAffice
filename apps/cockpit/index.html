<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"><title>AriaOS Cockpit</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:18px;align-items:center;padding:17px 22px;background:#111;color:#fff;position:sticky;top:0;z-index:2}header strong{font-size:20px}.status{margin-left:auto;font-size:12px;opacity:.82}nav{display:flex;gap:7px;padding:11px 20px;background:#fff;border-bottom:1px solid #ddd;overflow:auto}nav button{border:0;background:#eee;padding:9px 12px;border-radius:999px;white-space:nowrap}nav button[aria-selected=true]{background:#111;color:#fff}main{max-width:1240px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card,.row{background:#fff;border:1px solid #ddd;border-radius:13px;padding:15px}.metric{font-size:27px;font-weight:750}.muted{color:#666;font-size:12px}.list{display:grid;gap:8px}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#eee;margin:2px}.ok{background:#e9f8e9}.warn{background:#fff2cf}.bad{background:#ffe5e5}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;vertical-align:top}button.action{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 10px}button.reject{background:#fff;color:#111;border:1px solid #aaa}input{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px}pre{white-space:pre-wrap;overflow:auto;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:13px}main{padding:13px}table{display:block;overflow:auto;font-size:12px}}</style></head><body><header><strong>AriaOS</strong><span>Business OS · Zero-Cost Compute Market</span><span class="status" id="health">health: loading</span></header><nav id="tabs" aria-label="Cockpit sections"></nav><main id="app" aria-live="polite"></main><script>
const sections=['Today','Tasks','Memory','Decisions','Approvals','Agents','Compute','System'];let current='Today',state={},budget={},compute={providers:[],models:[],routes:[],incidents:[],budget:{}},adminToken='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const row=(k,v)=>`<div class="row"><strong>${esc(k)}</strong><div class="muted">${esc(v)}</div></div>`;
function nav(){tabs.innerHTML=sections.map(s=>`<button aria-selected="${s===current}" data-s="${s}">${s}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.s;nav();render()})}
function computeView(){const p=compute.providers||[],m=compute.models||[],active=p.filter(x=>x.productionEligible),unsafe=p.filter(x=>!x.productionEligible),routes=compute.routes||[];return `<h2>Compute Market</h2><div class="grid"><div class="card"><h3>Production-eligible providers</h3><div class="metric">${active.length}</div><div class="muted">positive proof only</div></div><div class="card"><h3>Models discovered</h3><div class="metric">${m.length}</div></div><div class="card"><h3>Monetary spend</h3><div class="metric">$${Number(compute.budget?.cumulativeMonetarySpendUsd||0).toFixed(0)}</div><div class="muted">hard cap $0</div></div><div class="card"><h3>Reserved free capacity</h3><div class="metric">${Number(compute.budget?.currentReserved||0).toFixed(0)}</div></div><div class="card"><h3>Unsafe / inactive</h3><div class="metric">${unsafe.length}</div></div><div class="card"><h3>Incidents</h3><div class="metric">${(compute.incidents||[]).length}</div></div></div><h3>Provider registry</h3><table><thead><tr><th>Provider</th><th>Free type</th><th>Billing</th><th>Privacy</th><th>Route</th><th>Verified</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.providerName)}</td><td>${esc(x.freeType)}</td><td>${esc(x.billingSafety)}</td><td>${esc(x.privacyClass)}</td><td><span class="badge ${x.productionEligible?'ok':'warn'}">${esc(x.routeState)}</span></td><td>${esc(x.lastVerifiedAt)}</td></tr>`).join('')}</tbody></table><h3>Recent routes</h3><div class="list">${routes.slice(0,10).map(x=>row(`${x.selected_provider_id||'NONE'} / ${x.selected_model_id||'NO_SAFE_MODEL_ROUTE'}`,`${x.task_id} · ${x.reason} · score=${x.selected_score??'n/a'}`)).join('')||row('No routes','No model route executed yet')}</div>`}
function render(){const s=state||{},pending=(s.approvals||[]).filter(x=>x.state==='PENDING');const views={Today:`<div class="grid"><div class="card"><h2>CEO priority</h2><div class="metric">${esc((s.decisions||[]).at(-1)?.priority||'No priority yet')}</div></div><div class="card"><h3>Due tasks</h3><div class="metric">${(s.tasks||[]).filter(x=>x.status==='QUEUED').length}</div></div><div class="card"><h3>Pending approvals</h3><div class="metric">${pending.length}</div></div><div class="card"><h3>Compute providers</h3><div class="metric">${(compute.providers||[]).length}</div></div><div class="card"><h3>AI spend</h3><div class="metric">$0</div><div class="muted">billable fallback denied</div></div><div class="card"><h3>Agents</h3>${['CEO','RESEARCH','CMO','SALES','DATA','DEV','AUD'].map(x=>`<span class="badge">${x}</span>`).join('')}</div></div>`,Tasks:`<h2>Tasks</h2><div class="list">${(s.tasks||[]).map(x=>row(`${x.type} · ${x.status}`,`owner=${x.requestedBy} priority=${x.priority}`)).join('')||row('No tasks','Queue empty')}</div>`,Memory:`<h2>Memory</h2><table><thead><tr><th>Status</th><th>Statement</th><th>Confidence</th><th>Source</th></tr></thead><tbody>${(s.knowledge||[]).map(x=>`<tr><td>${esc(x.status)}</td><td>${esc(x.statement)}</td><td>${esc(x.confidence)}</td><td>${esc((x.sourceRefs||[]).join(', '))}</td></tr>`).join('')}</tbody></table>`,Decisions:`<h2>Decisions</h2><div class="list">${(s.decisions||[]).map(x=>row(x.priority,`${x.rationale} · AUD=${x.auditVerdict}`)).join('')}</div>`,Approvals:`<h2>Approvals</h2><div class="card"><label for="adminToken"><strong>Admin bearer token</strong></label><input id="adminToken" type="password" autocomplete="off" placeholder="page memory only"><div class="muted">Never persisted in localStorage.</div></div><div class="list">${(s.approvals||[]).map(x=>`<div class="row"><strong>${esc(x.actionClass)} · ${esc(x.state)}</strong><p>${esc(x.reason)}</p>${x.state==='PENDING'?`<button class="action" data-approval="${esc(x.id)}" data-op="approve">Approve</button> <button class="action reject" data-approval="${esc(x.id)}" data-op="reject">Reject</button>`:''}</div>`).join('')||row('No approvals','No protected action waiting')}</div>`,Agents:`<h2>Agents</h2><div class="grid">${['CEO','RESEARCH','CMO','SALES','DATA','DEV','AUD'].map(role=>`<div class="card"><h3>${role}</h3><div class="metric">${(s.modelCalls||[]).filter(c=>c.role===role).length}</div><div class="muted">model calls via aria-models only</div></div>`).join('')}</div>`,Compute:computeView(),System:`<h2>System</h2><div class="grid"><div class="card"><h3>Canonical memory</h3><div class="metric">D1</div></div><div class="card"><h3>Business effects</h3><div>aria-effects only</div></div><div class="card"><h3>Model execution</h3><div>aria-models only</div></div><div class="card"><h3>Quota governor</h3><div>Durable Object reservations</div></div><div class="card"><h3>Cost hard cap</h3><div class="metric">$0</div></div><div class="card"><h3>Deploy SHA</h3><div class="muted" id="sha">loading</div></div></div>`};app.innerHTML=views[current];if(current==='Approvals')bindApprovalActions()}
function bindApprovalActions(){const input=document.getElementById('adminToken');if(input){input.value=adminToken;input.oninput=()=>adminToken=input.value}document.querySelectorAll('[data-approval]').forEach(button=>button.onclick=async()=>{if(!adminToken)return;button.disabled=true;try{const r=await fetch(`/api/approvals/${encodeURIComponent(button.dataset.approval)}/${button.dataset.op}`,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${adminToken}`},body:JSON.stringify({actor:'cockpit-human'})});if(!r.ok)throw new Error((await r.json()).error||`HTTP ${r.status}`);await load()}finally{button.disabled=false}})}
async function safe(url,fallback){try{const r=await fetch(url);return r.ok?await r.json():fallback}catch{return fallback}}
async function load(){const [h,s,b,p,m,r,i,cb]=await Promise.all([safe('/api/health',{ok:false}),safe('/api/state',{}),safe('/api/system/budget',{}),safe('/api/compute/providers',[]),safe('/api/compute/models',[]),safe('/api/compute/routes',[]),safe('/api/compute/incidents',[]),safe('/api/compute/budget',{})]);health.textContent=`health: ${h.ok?'PASS':'FAIL'}`;state=s;budget=b;compute={providers:p,models:m,routes:r,incidents:i,budget:cb};render();const sha=document.getElementById('sha');if(sha)sha.textContent=h.sha||'unknown'}nav();render();load();
</script></body></html>
