[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allora-edge"
version = "0.1.0"
description = "Zero-key, read-only Allora mainnet topic radar and shadow-worker toolkit"
requires-python = ">=3.11"
authors = [{name = "Allora-Edge"}]
dependencies = []

[project.scripts]
allora-edge = "allora_edge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
